services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    env_file:
      - path: .env
        required: false
    environment:
      # Sends traces, metrics and logs to the local observability stack.
      OTEL_EXPORTER_OTLP_ENDPOINT: http://observability:4318
      # Trace sampling defaults to a parent-based trace ID ratio derived from
      # APPLICATION_ENVIRONMENT (1.0 development and staging, 0.1 production).
      # Override with the standard OTEL_TRACES_SAMPLER and
      # OTEL_TRACES_SAMPLER_ARG (see internal/foundation/telemetry/doc.go).
      # Connects as the application role only, never the schema-owning
      # migration role (see internal/foundation/database/doc.go).
      DATABASE_URL: postgres://frappe_application:frappe_application_development_only@database:5432/frappe?sslmode=disable
      # Rate limiting is off by default (so `go run` needs no Valkey) and
      # enabled here against the bundled Valkey.
      RATE_LIMIT_ENABLED: "true"
      VALKEY_ADDRESS: valkey:6379
      # The read-through cache is off by default and uses the bundled
      # Valkey here, sharing the rate limiter's client.
      CACHE_ENABLED: "true"
      CACHE_STORE: valkey
      # The event broker is off by default (EVENTS_BROKER=none) and uses
      # the bundled NATS JetStream here.
      EVENTS_BROKER: nats
      NATS_URL: nats://nats:4222
      # The outbox relay is off by default and enabled here: it publishes
      # recorded events to the broker above, connecting as the outbox relay
      # role (see deployments/database/initialize.sql).
      OUTBOX_ENABLED: "true"
      DATABASE_OUTBOX_RELAY_URL: postgres://frappe_outbox_relay:frappe_outbox_relay_development_only@database:5432/frappe?sslmode=disable
    # No healthcheck is defined here on purpose. The image is
    # gcr.io/distroless/static-debian12:nonroot (see Dockerfile), which has
    # no shell and no curl/wget to run a command-based healthcheck with.
    # The app does expose GET /health/live and /health/ready (see
    # internal/foundation/httpserver); an orchestrator with its own HTTP
    # probe support (Kubernetes livenessProbe/readinessProbe, an external
    # load balancer, and so on) should use those instead.
    # Hardening: immutable root fs, no privilege escalation, no capabilities.
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    depends_on:
      observability:
        condition: service_started
      database:
        condition: service_healthy
      valkey:
        condition: service_healthy
      nats:
        condition: service_healthy

  # Local NATS with JetStream, the event broker (see
  # internal/foundation/nats). Development only: no authentication.
  # Port 8222 serves the monitoring endpoints (/healthz, /jsz).
  nats:
    image: nats:2.15.0-alpine
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz?js-enabled-only=true"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Local Valkey, backing distributed rate limiting (see
  # internal/foundation/ratelimit). Development only: no password, no
  # persistence needed for rate limit state.
  valkey:
    image: valkey/valkey:8.1.4
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Local Postgres. Roles are bootstrapped once, on first volume init, by
  # deployments/database/initialize.sql (see that file and
  # internal/foundation/database/doc.go for the two-role model).
  database:
    image: postgres:18.1
    environment:
      POSTGRES_DB: frappe
      # Only the postgres superuser's own password; frappe_migration and
      # frappe_application are created by initialize.sql instead, each
      # with their own development-only password.
      POSTGRES_PASSWORD: postgres_development_only
    ports:
      - "5432:5432"
    volumes:
      # The postgres 18+ image keeps PGDATA in a major-version subdirectory
      # (/var/lib/postgresql/18/docker) and declares its volume at
      # /var/lib/postgresql, so pg_upgrade --link can work across majors.
      # Mounting at the old /var/lib/postgresql/data path would not persist
      # the data directory at all.
      - database-data:/var/lib/postgresql
      - ./deployments/database/initialize.sql:/docker-entrypoint-initdb.d/initialize.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d frappe"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Local observability stack: Grafana, Loki, Tempo and Mimir bundled
  # together, receiving OTLP traces, metrics and logs over HTTP.
  observability:
    image: grafana/otel-lgtm:0.33.1
    ports:
      - "3000:3000" # Grafana UI
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
    restart: unless-stopped

volumes:
  database-data:
  nats-data:
