# Host ports default to the standard ones; set FRAPPE_<SERVICE>_PORT (see README) when another project already uses one.
services:
  postgres:
    image: 'postgres:18-alpine'
    environment:
      - 'POSTGRES_DB=frappe'
      - 'POSTGRES_USER=frappe'
      - 'POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-frappe}'
      - 'FRAPPE_OWNER_PASSWORD=${FRAPPE_OWNER_PASSWORD:-frappe_owner}'
      - 'FRAPPE_APP_PASSWORD=${FRAPPE_APP_PASSWORD:-frappe_app}'
    labels:
      # The app connects as frappe_app and Flyway as frappe_owner (application.properties),
      # not as the bootstrap superuser Spring Boot would derive from this service.
      org.springframework.boot.ignore: 'true'
    volumes:
      - './docker/postgres/initdb:/docker-entrypoint-initdb.d:ro'
    ports:
      - '${FRAPPE_POSTGRES_PORT:-5432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U frappe -d frappe']
      interval: 5s
      timeout: 5s
      retries: 5

  nats:
    image: 'nats:2.12-alpine'
    command: '-js -m 8222'
    ports:
      - '${FRAPPE_NATS_PORT:-4222}:4222'
      - '${FRAPPE_NATS_MONITOR_PORT:-8222}:8222'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:8222/healthz || exit 1']
      interval: 5s
      timeout: 5s
      retries: 5

  # Grafana (http://localhost:3000, or FRAPPE_GRAFANA_PORT) with Tempo (traces), Prometheus (metrics) and Loki (logs) behind one OTLP receiver.
  # Spring Boot's Docker Compose support recognises the image and points the app's OTLP exporters at it.
  otel-lgtm:
    image: 'grafana/otel-lgtm:0.33.1'
    ports:
      - '${FRAPPE_GRAFANA_PORT:-3000}:3000'
      - '${FRAPPE_OTLP_GRPC_PORT:-4317}:4317'
      - '${FRAPPE_OTLP_HTTP_PORT:-4318}:4318'

  # Short-lived secrets and rate limits. Spring Boot 4.1 does not recognise the valkey image by name; the label makes
  # its Docker Compose support connect to it as Redis (Valkey speaks the same protocol).
  valkey:
    image: 'valkey/valkey:9-alpine'
    labels:
      org.springframework.boot.service-connection: 'redis'
    ports:
      - '${FRAPPE_VALKEY_PORT:-6379}:6379'
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  # Local mail: the app sends over SMTP (application-local.properties), the web UI (http://localhost:8025, or
  # FRAPPE_MAILPIT_UI_PORT) shows every mail. Spring Boot 4.1 has no Mailpit service connection, so the profile sets
  # spring.mail.* itself.
  mailpit:
    image: 'axllent/mailpit:v1.31'
    ports:
      - '${FRAPPE_MAILPIT_SMTP_PORT:-1025}:1025'
      - '${FRAPPE_MAILPIT_UI_PORT:-8025}:8025'
