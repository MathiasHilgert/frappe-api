services:
  postgres:
    image: 'postgres:18-alpine'
    environment:
      - 'POSTGRES_DB=frappe'
      - 'POSTGRES_USER=frappe'
      - 'POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-frappe}'
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U frappe -d frappe']
      interval: 5s
      timeout: 5s
      retries: 5

  nats:
    image: 'nats:2.12-alpine'
    command: '-js -m 8222'
    ports:
      - '4222:4222'
      - '8222:8222'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:8222/healthz || exit 1']
      interval: 5s
      timeout: 5s
      retries: 5
