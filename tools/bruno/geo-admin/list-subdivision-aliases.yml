info:
  name: List subdivision aliases
  type: http
  seq: 16

http:
  method: GET
  url: "{{baseUrl}}/v1/geo/subdivisions/AR-X/aliases"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.aliases
      operator: isArray
    - expression: res.headers['cache-control']
      operator: eq
      value: '"no-store"'

settings:
  encodeUrl: true

docs: |-
  `GET /v1/geo/subdivisions/{subdivisionCode}/aliases`: the source's aliases and the manual ones. Never
  cached (`no-store`). TODO(auth).
