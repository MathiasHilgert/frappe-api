info:
  name: List holiday syncs
  type: http
  seq: 12

http:
  method: GET
  url: "{{baseUrl}}/v1/geo/holiday-syncs"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.sources
      operator: isArray
    - expression: res.headers['cache-control']
      operator: eq
      value: '"no-store"'

settings:
  encodeUrl: true

docs: |-
  `GET /v1/geo/holiday-syncs`: every holiday source that ran at least once, with how its last run ended. Never
  cached (`Cache-Control: no-store`). TODO(auth).
