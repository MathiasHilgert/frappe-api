name: Local
variables:
  - name: baseUrl
    value: http://localhost:5080
    description: The Api from `just run api` (port 5080).
  - name: language
    value: es-AR
    description: Accept-Language of every request (en, es, es-AR, es-MX or pt-BR).
  - name: webhookSecret
    value: bG9jYWwtb25seS1yZXNlbmQtd2ViaG9vay1zaWduaW5nLXNlY3JldA==
    description: The signing secret of Resend's webhook that the Api in this environment holds; the local-only placeholder of deploy/.env.example. The Notifications requests sign their calls with it.
