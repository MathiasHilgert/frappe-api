info:
  name: Startup
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/health/startup"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.status
      operator: eq
      value: '"Healthy"'
    - expression: res.body.checks
      operator: isArray
    - expression: res.body.checks[0].name
      operator: isString

settings:
  encodeUrl: true

docs: |-
  `GET /health/startup`: 200 when the host finished starting.
