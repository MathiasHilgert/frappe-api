info:
  name: Readiness
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/health/ready"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.status
      operator: eq
      value: '"Healthy"'
    - expression: res.body.checks
      operator: isArray
    - expression: res.body.checks[0].name
      operator: isString

settings:
  encodeUrl: true

docs: |-
  `GET /health/ready`: 200 when every critical dependency answers (the `geo-database` check); a Valkey outage only makes the `valkey` check and
  the overall `status` `Degraded`, still 200.
