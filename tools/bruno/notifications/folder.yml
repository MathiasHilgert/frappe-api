  content: |-
    # Notifications

    The explicit send route, `POST /v1/notifications/sends`, and the Resend webhook. The send route exists only while the Api runs as **Development** (`just run api`,
    which sets no environment, runs as Development): the composition maps it only then, so the Stack environment (the compose
    stack runs as Production) answers 404 and these requests **skip themselves** there, which is why CI's `--env Stack` run passes.
    The route is left out of `contracts/openapi/v1.json` on purpose, for the same reason.
    Run them with `--env Local`, with the Worker running (`just run worker`), to see the email in the Worker's log (the logging sender)
    or in your inbox when Resend is selected.

    - **Send an account activation code (202):** one request of the module's first kind. The same `Idempotency-Key` sends once.
    - **Unknown kind (400):** `notifications.kind.unknown`.
    - **Invalid payload (400):** `notifications.payload.invalid`, with the fields to fix in `parameters.fields`.

    The Resend webhook, `POST /v1/notifications/webhooks/resend`, is served in every environment, so its requests run against Stack too:

    - **Receive a Resend webhook (204):** a delivered event signed by the request's own script with the environment's `webhookSecret`.
    - **Receive a forged webhook (400):** `notifications.webhook_signature.invalid`.
  type: text/markdown
