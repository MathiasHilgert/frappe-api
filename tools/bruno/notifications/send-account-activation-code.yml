info:
  name: Send an account activation code (202)
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/v1/notifications/sends"
  headers:
    - name: Idempotency-Key
      value: bruno-send-account-activation-code
      description: The same key sends once; its request identity is derived from it.
  body:
    type: json
    data: |-
      {
        "kind": "account_activation_code",
        "payload": {
          "email": "ana@example.com",
          "language": "es-AR",
          "name": "Ana",
          "code": "482913"
        }
      }

runtime:
  scripts:
    - type: before-request
      code: |-
        // Development only: the compose stack runs as Production and does not map the route.
        if (bru.getEnvName() === 'Stack') {
          bru.runner.skipRequest();
        }
  assertions:
    - expression: res.status
      operator: eq
      value: "202"
    - expression: res.headers.location
      operator: isUndefined

settings:
  encodeUrl: true

docs: |-
  `POST /v1/notifications/sends` with the sample of `account_activation_code`: 202 with no `Location`, since the email is sent afterwards by the
  Worker. Development only (skipped against Stack).
