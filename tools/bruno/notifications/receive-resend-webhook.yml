info:
  name: Receive a Resend webhook (204)
  type: http
  seq: 4

http:
  method: POST
  url: "{{baseUrl}}/v1/notifications/webhooks/resend"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: text
    data: '{"type":"email.delivered","created_at":"2026-11-24T10:00:00.000Z","data":{"email_id":"re_bruno_sample","to":["bruno@example.com"]}}'

runtime:
  scripts:
    - type: before-request
      code: |-
        // Signs the call as Resend (Svix) does: HMAC-SHA256 of "{id}.{timestamp}.{body}" under the secret's decoded bytes. The signature
        // is recomputed on every run because the Api refuses a call whose timestamp is more than five minutes old.
        const CryptoJS = require('crypto-js');
        const id = 'msg_bruno_' + Date.now();
        const timestamp = Math.floor(Date.now() / 1000).toString();
        // A text body goes out byte for byte as written, so the signature covers that raw string (serialized only if Bruno hands it over parsed).
        const raw = req.getBody();
        const body = typeof raw === 'string' ? raw : JSON.stringify(raw);
        const secret = bru.getEnvVar('webhookSecret').replace(/^whsec_/, '');
        const signature = CryptoJS.HmacSHA256(`${id}.${timestamp}.${body}`, CryptoJS.enc.Base64.parse(secret));
        req.setHeader('svix-id', id);
        req.setHeader('svix-timestamp', timestamp);
        req.setHeader('svix-signature', 'v1,' + CryptoJS.enc.Base64.stringify(signature));
  assertions:
    - expression: res.status
      operator: eq
      value: "204"
    - expression: res.headers['cache-control']
      operator: contains
      value: '"no-store"'

settings:
  encodeUrl: true

docs: |-
  A signed `email.delivered` event for a message the Api does not know: the call is authentic, so it answers 204, and the event is parked
  (the delivery it is about may still be committing). The `before-request` script signs the call with the environment's `webhookSecret`.
