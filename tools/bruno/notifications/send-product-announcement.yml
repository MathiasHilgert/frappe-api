info:
  name: Send a product announcement (202)
  type: http
  seq: 10

http:
  method: POST
  url: "{{baseUrl}}/v1/notifications/sends"
  headers:
    - name: Idempotency-Key
      value: bruno-send-product-announcement
      description: The same key sends once; its request identity is derived from it.
  body:
    type: json
    data: |-
      {
        "kind": "product_announcement",
        "payload": {
          "email": "delivered@resend.dev",
          "language": "es-AR",
          "name": "Ana",
          "headline": "Nuevo en Frappé",
          "summary": "Ya podés crear tu cuenta.",
          "url": "https://example.com/novedades"
        }
      }

runtime:
  scripts:
    - type: before-request
      code: |-
        // Development only: the compose stack runs as Production and does not map the route.
        if (bru.getEnvName() === 'Stack') {
          bru.runner.skipRequest();
        }
  assertions:
    - expression: res.status
      operator: eq
      value: "202"
    - expression: res.headers.location
      operator: isUndefined

settings:
  encodeUrl: true

docs: |-
  `POST /v1/notifications/sends` with a `product_announcement` (Marketing) to Resend's `delivered` test inbox: 202; the mail carries the unsubscribe headers and link. Development only (skipped against Stack).
