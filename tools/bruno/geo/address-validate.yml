info:
  name: Validate an address
  type: http
  seq: 41

http:
  method: POST
  url: "{{baseUrl}}/v1/geo/address-validations"
  body:
    type: json
    data: |-
      {
        "reference": "{{addressSuggestionId}}",
        "session": "8f14e45f-ceea-467a-9575-0e1b2c3d4e5f",
        "language": "es"
      }

runtime:
  assertions:
    - expression: res.headers['cache-control']
      operator: contains
      value: '"no-store"'

settings:
  encodeUrl: true

docs: |-
  Validates the chosen suggestion into the normalized address the consuming module stores. Set
  `addressSuggestionId` to an `id` from the suggestions answer and reuse its session. The reference
  goes in the body, never in the URL, so access logs and traces never record it.
