info:
  name: Get country
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/v1/geo/countries/AR"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.code
      operator: eq
      value: '"AR"'
    - expression: res.body.alpha3
      operator: eq
      value: '"ARG"'
    - expression: res.body.currencies
      operator: isArray
    - expression: res.body.capabilities
      operator: isDefined

settings:
  encodeUrl: true

docs: |-
  `GET /v1/geo/countries/{countryCode}`: one country (case-insensitive code) and what Geo covers for it
  (`capabilities`: holiday years per scope, business-day policies, time zone).
