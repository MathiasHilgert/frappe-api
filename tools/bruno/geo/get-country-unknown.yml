info:
  name: Get country (unknown, 404)
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/v1/geo/countries/QX"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "404"
    - expression: res.headers['content-type']
      operator: startsWith
      value: '"application/problem+json"'
    - expression: res.body.type
      operator: eq
      value: '"urn:frappe:problem:not-found"'
    - expression: res.body.errors[0].code
      operator: eq
      value: '"geo.country.not_found"'

settings:
  encodeUrl: true

docs: |-
  `QX` is no ISO 3166-1 country: 404 with error code `geo.country.not_found`.
