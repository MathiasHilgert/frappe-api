info:
  name: Subdivision holidays
  type: http
  seq: 15

http:
  method: GET
  url: "{{baseUrl}}/v1/geo/subdivisions/AR-X/holidays?year=2026"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.jurisdiction
      operator: eq
      value: '"AR-X"'
    - expression: res.body.observances
      operator: isArray

settings:
  encodeUrl: true

docs: |-
  `GET /v1/geo/subdivisions/{subdivisionCode}/holidays?year=`: the national calendar plus the subdivision's own.
