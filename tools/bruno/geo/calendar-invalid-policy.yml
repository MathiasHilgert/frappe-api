info:
  name: Calendar day (invalid policy, 400)
  type: http
  seq: 18

http:
  method: GET
  url: "{{baseUrl}}/v1/geo/countries/AR/calendar/2026-07-15?policy=sometimes"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "400"
    - expression: res.headers['content-type']
      operator: startsWith
      value: '"application/problem+json"'
    - expression: res.body.type
      operator: eq
      value: '"urn:frappe:problem:invalid-value"'
    - expression: res.body.errors[0].code
      operator: eq
      value: '"geo.business_day_policy.invalid"'

settings:
  encodeUrl: true

docs: |-
  An unknown policy: 400 with error code `geo.business_day_policy.invalid`.
