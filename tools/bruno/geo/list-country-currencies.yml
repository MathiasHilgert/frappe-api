info:
  name: List country currencies
  type: http
  seq: 6

http:
  method: GET
  url: "{{baseUrl}}/v1/geo/countries/AR/currencies"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.currencies[0].code
      operator: eq
      value: '"ARS"'

settings:
  encodeUrl: true

docs: |-
  `GET /v1/geo/countries/{countryCode}/currencies`: the currencies a country uses today.
