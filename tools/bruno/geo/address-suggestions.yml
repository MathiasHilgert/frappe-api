info:
  name: Address suggestions
  type: http
  seq: 40

http:
  method: GET
  url: "{{baseUrl}}/v1/geo/address-suggestions?q=Av Corrientes 1234&session=8f14e45f-ceea-467a-9575-0e1b2c3d4e5f&country=AR&language=es"

runtime:
  assertions:
    - expression: res.headers['cache-control']
      operator: contains
      value: '"no-store"'

settings:
  encodeUrl: true

docs: |-
  Suggestions while a user types, within one search session (a UUID the client generates).
  Without `Geo:Google:Places:ApiKey` the answer is 503 `geo.addresses.unavailable`.
