info:
  name: Get area
  type: http
  seq: 10

http:
  method: GET
  url: "{{baseUrl}}/v1/geo/areas/{{areaId}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.subdivisionCode
      operator: eq
      value: '"AR-X"'
    - expression: res.body.isLocalGovernment
      operator: isBoolean

settings:
  encodeUrl: true

docs: |-
  `GET /v1/geo/areas/{areaId}`: one administrative area (its id from "List areas").
