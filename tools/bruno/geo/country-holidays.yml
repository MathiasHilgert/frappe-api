info:
  name: Country holidays
  type: http
  seq: 13

http:
  method: GET
  url: "{{baseUrl}}/v1/geo/countries/AR/holidays?year=2026"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.jurisdiction
      operator: eq
      value: '"AR"'
    - expression: res.body.year
      operator: eq
      value: "2026"
    - expression: res.body.observances
      operator: isArray
    - expression: res.body.attributions
      operator: isArray

settings:
  encodeUrl: true

docs: |-
  `GET /v1/geo/countries/{countryCode}/holidays?year=`: the national calendar of a year (default the current one),
  with the credit its sources require.
