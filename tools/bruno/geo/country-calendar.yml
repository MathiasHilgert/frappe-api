info:
  name: Country calendar day
  type: http
  seq: 16

http:
  method: GET
  url: "{{baseUrl}}/v1/geo/countries/AR/calendar/2026-07-09?policy=commercial"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.businessDay
      operator: eq
      value: "false"
    - expression: res.body.weekend
      operator: isBoolean
    - expression: res.body.observances
      operator: isArray

settings:
  encodeUrl: true

docs: |-
  `GET /v1/geo/countries/{countryCode}/calendar/{date}?policy=`: whether a date is a business day under a policy
  (`banking`, `labor` or `commercial`) and why. 9 July is Independence Day.
