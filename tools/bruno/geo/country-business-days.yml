info:
  name: Country business days
  type: http
  seq: 19

http:
  method: GET
  url: "{{baseUrl}}/v1/geo/countries/AR/business-days?from=2026-11-06&count=3&policy=banking"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.from
      operator: eq
      value: '"2026-11-06"'
    - expression: res.body.dates
      operator: isArray
    - expression: res.body.dates.length
      operator: eq
      value: "3"

settings:
  encodeUrl: true

docs: |-
  `GET /v1/geo/countries/{countryCode}/business-days?from=&count=&policy=`: the next business days from a date
  (inclusive), at most 60.
