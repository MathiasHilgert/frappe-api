info:
  name: Get locality
  type: http
  seq: 12

http:
  method: GET
  url: "{{baseUrl}}/v1/geo/localities/{{localityId}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.subdivisionCode
      operator: eq
      value: '"AR-X"'
    - expression: res.body.name
      operator: isString

settings:
  encodeUrl: true

docs: |-
  `GET /v1/geo/localities/{localityId}`: one locality (its id from "Search localities").
