info:
  name: List countries
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/v1/geo/countries"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.countries
      operator: isArray
    - expression: res.body.countries[0].code
      operator: isString

settings:
  encodeUrl: true

docs: |-
  `GET /v1/geo/countries`: the 249 ISO 3166-1 countries, with names in the request's language.
