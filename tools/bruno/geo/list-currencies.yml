info:
  name: List currencies
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseUrl}}/v1/geo/currencies"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.currencies
      operator: isArray
    - expression: res.body.currencies[0].code
      operator: isString

settings:
  encodeUrl: true

docs: |-
  `GET /v1/geo/currencies`: every ISO 4217 currency some country uses today, ordered by code.
