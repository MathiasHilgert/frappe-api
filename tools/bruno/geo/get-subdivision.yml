info:
  name: Get subdivision
  type: http
  seq: 8

http:
  method: GET
  url: "{{baseUrl}}/v1/geo/subdivisions/AR-X"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.code
      operator: eq
      value: '"AR-X"'
    - expression: res.body.countryCode
      operator: eq
      value: '"AR"'
    - expression: res.body.aliases
      operator: isArray

settings:
  encodeUrl: true

docs: |-
  `GET /v1/geo/subdivisions/{subdivisionCode}`: one subdivision, with its centroid and aliases.
