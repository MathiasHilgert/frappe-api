info:
  name: Subdivision calendar day
  type: http
  seq: 17

http:
  method: GET
  url: "{{baseUrl}}/v1/geo/subdivisions/AR-X/calendar/2026-07-15?policy=banking"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.jurisdiction
      operator: eq
      value: '"AR-X"'
    - expression: res.body.policy
      operator: eq
      value: '"banking"'
    - expression: res.body.businessDay
      operator: isBoolean

settings:
  encodeUrl: true

docs: |-
  `GET /v1/geo/subdivisions/{subdivisionCode}/calendar/{date}?policy=`: the same question in a subdivision, whose
  own holidays count too.
