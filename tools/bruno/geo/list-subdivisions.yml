info:
  name: List subdivisions
  type: http
  seq: 7

http:
  method: GET
  url: "{{baseUrl}}/v1/geo/countries/AR/subdivisions"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.subdivisions
      operator: isArray
    - expression: res.body.subdivisions[0].code
      operator: isString

settings:
  encodeUrl: true

docs: |-
  `GET /v1/geo/countries/{countryCode}/subdivisions`: a covered country's ISO 3166-2 subdivisions (after the
  territory sync).
