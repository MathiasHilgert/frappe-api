opencollection: 1.0.0
info:
  name: Frappé API

request:
  headers:
    - name: Accept
      value: application/json
      description: Every endpoint answers JSON; errors are application/problem+json.
    - name: Accept-Language
      value: "{{language}}"
      description: The language texts are answered in (en, es, es-AR, es-MX, pt-BR). A request may override it.

docs:
  content: |-
    # Frappé API

    Anonymous: no auth and no secrets. Pick an environment (Local
    or Stack) before sending.

    - **Health:** the three Kubernetes probes.
    - **Geo:** countries, currencies and territory.
    - **HTTP Conventions:** unknown routes.
    - **OpenAPI:** the machine-readable contract (`/openapi/v1.json`); the human one is Scalar at `{{baseUrl}}/docs/`.

    Every request sends `Accept: application/json` and `Accept-Language: {{language}}` from here. Errors are
    RFC 9457 Problem Details: `type` is the category (`urn:frappe:problem:not-found`) and `errors` lists every
    error with its stable `code` (`http.not_found`), which the error requests assert.
    `/v1` is rate limited per client (120 requests a minute by default): a 429 means wait a minute.
  type: text/markdown
