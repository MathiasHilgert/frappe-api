info:
  name: Register an owner with an invalid email (400)
  type: http
  seq: 5

http:
  method: POST
  url: "{{baseUrl}}/v1/identity/owners"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "name": { "given": "Bruno", "family": "Tester" },
        "email": "not-an-address",
        "password": "{{password}}"
      }

runtime:
  scripts:
    - type: before-request
      code: |-
        // A new address and a password nobody has leaked on every run: the address must not exist, and the Api refuses breached passwords.
        const stamp = Date.now() + '-' + Math.floor(Math.random() * 1e6);
        bru.setVar('email', `bruno-${stamp}@example.com`);
        bru.setVar('password', `bruno-${stamp}-${Math.random().toString(36).slice(2)}-pw`);
  assertions:
    - expression: res.status
      operator: eq
      value: "400"
    - expression: res.body.errors[0].code
      operator: eq
      value: '"identity.email.invalid"'

settings:
  encodeUrl: true

docs: |-
  An address that is missing or not shaped like one is `400 identity.email.invalid`. Every invalid field is reported in the same answer.
