docs:
  content: |-
    # Identity

    Owner accounts and their sessions. A session is an opaque token that a client sends as `Authorization: Bearer <token>`; the web console
    sends it in the `__Host-frappe-session` cookie instead (a browser's own request, so these requests, which send no cookie, cannot play it).
    A Bearer token wins over the cookie, a cookie sent twice never authenticates, and every refusal is the same `401`
    `identity.session.invalid` with `WWW-Authenticate: Bearer`.

    The requests here assert what an anonymous caller sees; the ones that need the mailed code or a session are covered by the Api's
    integration tests. Registering creates a pending owner with a new address on every run (it is purged after seven days):

    - **Register an owner (201):** `POST /v1/identity/owners`; the same answer for a taken address.
    - **Register with an invalid email or a link as name (400):** `identity.email.invalid`, `identity.name.invalid`.
    - **Verify an owner that does not exist, or with a malformed id (422):** `identity.code.invalid`.
    - **Resend a verification code (202):** always, whatever the id.

    - **Get the current session without one (401):** `GET /v1/identity/sessions/current` with no credential.
    - **Get the current session with a token nobody holds (401):** a well-formed token the Api never issued answers the same.
    - **Log out without a session (401):** `DELETE /v1/identity/sessions/current` with no credential.
    - **Log out with the session cookie and no console origin (403):** `http.origin.forbidden`, a dummy cookie is enough.

    - **Log in with wrong credentials (401):** `POST /v1/identity/sessions`, `identity.credentials.invalid`, never faster than half a second.
    - **Log in as a pending owner (403):** run after **Register an owner**: `identity.owner.verification_pending` with the owner id.
    - **Get / change the profile without a session (401):** `GET` and `PATCH /v1/identity/me`.
    - **Step up the session without a session (401):** `POST /v1/identity/sessions/current/step-ups`.

    The 200 and 204 examples (a session, the profile, logging out) need a verified owner and are covered by the Api's integration tests.
