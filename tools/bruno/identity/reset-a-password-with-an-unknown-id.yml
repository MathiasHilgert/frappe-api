info:
  name: Reset a password with an unknown id (422)
  type: http
  seq: 17

http:
  method: POST
  url: "{{baseUrl}}/v1/identity/password-resets/0198f2a0-0000-7000-8000-000000000000/confirmation"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      { "code": "000000", "newPassword": "a passphrase nobody has leaked, bruno" }

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "422"
    - expression: res.body.errors[0].code
      operator: eq
      value: '"identity.code.invalid"'

settings:
  encodeUrl: true

docs: |-
  `POST /v1/identity/password-resets/{resetId}/confirmation` with the mailed code and a new password. A wrong, expired, used or replaced code and an id that is unknown, made up or malformed are all `422 identity.code.invalid`: the answer tells nothing about which. A code takes 5 guesses and an owner 10 a day across all their codes; while guesses cannot be counted every id is `503 identity.attempts.unavailable`. The right code answers `204` and revokes every session of the owner; that needs the mailed code, so the Api's integration tests cover it.
