info:
  name: Get the current session with a token nobody holds (401)
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/v1/identity/sessions/current"
  headers:
    - name: Authorization
      value: Bearer fs_AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
      description: A token of the right format that no session holds.

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "401"
    - expression: res.headers['www-authenticate']
      operator: eq
      value: '"Bearer"'
    - expression: res.body.errors[0].code
      operator: eq
      value: '"identity.session.invalid"'

settings:
  encodeUrl: true

docs: |-
  A well-formed token (`fs_` and 43 characters) that no session holds is refused like a missing one, so the answer never says which it was.
  A text that is not a token at all is refused without looking anything up.
