info:
  name: Request a password reset (202)
  type: http
  seq: 16

http:
  method: POST
  url: "{{baseUrl}}/v1/identity/password-resets"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      { "email": "nobody-at-all@example.com" }

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "202"
    - expression: res.body.id
      operator: isDefined
    - expression: res.headers['location']
      operator: isUndefined
    - expression: res.responseTime
      operator: gte
      value: "500"

settings:
  encodeUrl: true

docs: |-
  `POST /v1/identity/password-resets` always answers `202` with an `id`, never sooner than half a second: an address that is unknown, malformed or not verified, and one over its budget of codes, are answered a made-up id, so neither the answer nor its time says whether a code was mailed. A verified owner's address is mailed a six-digit code, and the `id` is the one to confirm the reset with; that needs a mailbox, so the Api's integration tests cover it.
