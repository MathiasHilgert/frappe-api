info:
  name: List my sessions without a session (401)
  type: http
  seq: 30

http:
  method: GET
  url: "{{baseUrl}}/v1/identity/me/sessions"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "401"
    - expression: res.headers['www-authenticate']
      operator: eq
      value: '"Bearer"'
    - expression: res.body.errors[0].code
      operator: eq
      value: '"identity.session.invalid"'

settings:
  encodeUrl: true

docs: |-
  `GET /v1/identity/me/sessions` needs a session (paged with `limit` and `cursor`; 200 with `{ sessions, nextCursor }` with one). Without one it is the same 401 `identity.session.invalid` as any session route.
