info:
  name: Log in with wrong credentials (401)
  type: http
  seq: 11

http:
  method: POST
  url: "{{baseUrl}}/v1/identity/sessions"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      { "email": "nobody-at-all@example.com", "password": "a password nobody has" }

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "401"
    - expression: res.body.errors[0].code
      operator: eq
      value: '"identity.credentials.invalid"'
    - expression: res.headers['set-cookie']
      operator: isUndefined
    - expression: res.responseTime
      operator: gte
      value: "500"

settings:
  encodeUrl: true

docs: |-
  `POST /v1/identity/sessions` with an address and a password. A wrong password, an address nobody has and an address that cannot log in all answer this one `401 identity.credentials.invalid`, never faster than half a second, so neither the answer nor its time says which it was. An address that tries too often (10 attempts in 15 minutes, whatever their outcome) is answered `429 http.rate_limited` with `Retry-After`, and so is a client address that logs in too often. The right password answers `201` with the session (`id`, `token`, `idleExpiresAt`, `absoluteExpiresAt`) and the session cookie; that needs a verified owner, so the Api's integration tests cover it.
