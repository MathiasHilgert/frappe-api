info:
  name: Change the password without a session (401)
  type: http
  seq: 19

http:
  method: POST
  url: "{{baseUrl}}/v1/identity/me/password-changes"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      { "currentPassword": "a password nobody has", "newPassword": "a passphrase nobody has leaked, bruno" }

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "401"
    - expression: res.headers['www-authenticate']
      operator: eq
      value: '"Bearer"'
    - expression: res.body.errors[0].code
      operator: eq
      value: '"identity.session.invalid"'

settings:
  encodeUrl: true

docs: |-
  `POST /v1/identity/me/password-changes` needs a session. With one it asks for the current password again (`422 identity.password.incorrect` when it is not right; 10 tries in 15 minutes, then `429 http.rate_limited` with `Retry-After`), judges the new one (`422 identity.password.too_short`, `too_long` or `breached`), revokes every other session of the caller and answers `204`; the session that asked keeps working with the same token. That needs a verified owner, so the Api's integration tests cover it.
