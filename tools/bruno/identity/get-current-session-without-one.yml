info:
  name: Get the current session without one (401)
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/v1/identity/sessions/current"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "401"
    - expression: res.headers['www-authenticate']
      operator: eq
      value: '"Bearer"'
    - expression: res.headers['content-type']
      operator: startsWith
      value: '"application/problem+json"'
    - expression: res.body.type
      operator: eq
      value: '"urn:frappe:problem:unauthenticated"'
    - expression: res.body.errors[0].code
      operator: eq
      value: '"identity.session.invalid"'

settings:
  encodeUrl: true

docs: |-
  No bearer token and no session cookie: 401 Problem Details whose error `code` is `identity.session.invalid`, with `WWW-Authenticate: Bearer`.
