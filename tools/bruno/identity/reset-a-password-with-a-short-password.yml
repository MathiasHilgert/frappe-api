info:
  name: Reset a password with a short password (422)
  type: http
  seq: 18

http:
  method: POST
  url: "{{baseUrl}}/v1/identity/password-resets/0198f2a0-0000-7000-8000-000000000000/confirmation"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      { "code": "000000", "newPassword": "short" }

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "422"
    - expression: res.body.errors[0].code
      operator: eq
      value: '"identity.password.too_short"'

settings:
  encodeUrl: true

docs: |-
  The new password is judged before the code is looked at (10 to 128 characters, not in a public breach list), so a weak one costs the code no guess: `422 identity.password.too_short`, `identity.password.too_long` or `identity.password.breached`.
