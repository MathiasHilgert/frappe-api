info:
  name: Register an owner with a short password (422)
  type: http
  seq: 15

http:
  method: POST
  url: "{{baseUrl}}/v1/identity/owners"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "name": { "given": "Bruno", "family": "Tester" },
        "email": "{{email}}",
        "password": "short"
      }

runtime:
  scripts:
    - type: before-request
      code: |-
        // A new address and a password nobody has leaked on every run: the address must not exist, and the Api refuses breached passwords.
        const stamp = Date.now() + '-' + Math.floor(Math.random() * 1e6);
        bru.setVar('email', `bruno-${stamp}@example.com`);
        bru.setVar('password', `bruno-${stamp}-${Math.random().toString(36).slice(2)}-pw`);
  assertions:
    - expression: res.status
      operator: eq
      value: "422"
    - expression: res.body.errors[0].code
      operator: eq
      value: '"identity.password.too_short"'

settings:
  encodeUrl: true

docs: |-
  A password shorter than 10 characters is `422 identity.password.too_short`; nothing is registered.
