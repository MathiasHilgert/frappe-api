# Local development defaults matching compose.yaml, following its FRAPPE_*_PORT overrides. Activated by ./gradlew bootRun
# and the tests.
FRAPPE_DB_URL=jdbc:postgresql://localhost:${FRAPPE_POSTGRES_PORT:5432}/frappe
FRAPPE_APP_PASSWORD=frappe_app
FRAPPE_OWNER_PASSWORD=frappe_owner
frappe.nats.url=nats://localhost:${FRAPPE_NATS_PORT:4222}
FRAPPE_VALKEY_URL=redis://localhost:${FRAPPE_VALKEY_PORT:6379}
# Local only; every other environment sets its own random pepper.
FRAPPE_SECRET_PEPPER=local-development-pepper-not-a-secret

# Human-readable console locally (an empty format disables structured logging).
logging.structured.format.console=

# Trace every request locally.
management.tracing.sampling.probability=1.0

# Browse the API reference (Scalar) at http://localhost:8080/scalar.
scalar.enabled=true

# Mail goes to compose's Mailpit (UI at http://localhost:8025, or FRAPPE_MAILPIT_UI_PORT); no Resend key needed locally.
frappe.mail.provider=smtp
FRAPPE_MAIL_FROM=Frappé <no-reply@frappe.localhost>
spring.mail.host=localhost
spring.mail.port=${FRAPPE_MAILPIT_SMTP_PORT:1025}
