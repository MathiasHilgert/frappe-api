# Local development defaults matching compose.yaml. Activated by ./gradlew bootRun and the tests.
FRAPPE_DB_URL=jdbc:postgresql://localhost:5432/frappe
FRAPPE_APP_PASSWORD=frappe_app
FRAPPE_OWNER_PASSWORD=frappe_owner

# Human-readable console locally (an empty format disables structured logging).
logging.structured.format.console=

# Trace every request locally.
management.tracing.sampling.probability=1.0

# Browse the API reference (Scalar) at http://localhost:8080/scalar.
scalar.enabled=true
