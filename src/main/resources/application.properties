spring.application.name=frappe-api

# No credential defaults here: outside the local profile startup fails unless these are set.
# Runtime role: DML only (see docker/postgres/initdb).
spring.datasource.url=${FRAPPE_DB_URL}
spring.datasource.username=${FRAPPE_APP_USER:frappe_app}
spring.datasource.password=${FRAPPE_APP_PASSWORD}

# Migration role: owns module schemas. One history table for the whole database.
spring.flyway.user=${FRAPPE_OWNER_USER:frappe_owner}
spring.flyway.password=${FRAPPE_OWNER_PASSWORD}
spring.flyway.locations=classpath:db/migration
spring.flyway.schemas=platform

# One JSON object per line (Elastic Common Schema); SLF4J key/values and MDC become JSON fields.
logging.structured.format.console=ecs
# Micrometer Tracing writes traceId/spanId to the MDC; ECS names them trace.id and span.id.
logging.structured.json.rename[traceId]=trace.id
logging.structured.json.rename[spanId]=span.id

# Observability: Micrometer Observation over OpenTelemetry, exported via OTLP (see README, "Observability").
# Spans export only when management.opentelemetry.tracing.export.otlp.endpoint is set (or compose's otel-lgtm runs);
# metrics go to management.otlp.metrics.export.url. Both are set from the environment outside the local profile.
management.tracing.sampling.probability=${FRAPPE_TRACING_SAMPLING_PROBABILITY:0.1}
# JDBC spans carry the SQL text only; bound values (possibly personal data) never leave the process.
jdbc.datasource-proxy.include-parameter-values=false
