spring.application.name=frappe-api

# Runtime role: DML only (see docker/postgres/initdb). Defaults match compose.yaml.
spring.datasource.url=${FRAPPE_DB_URL:jdbc:postgresql://localhost:5432/frappe}
spring.datasource.username=${FRAPPE_APP_USER:frappe_app}
spring.datasource.password=${FRAPPE_APP_PASSWORD:frappe_app}

# Migration role: owns module schemas. One history table for the whole database.
spring.flyway.user=${FRAPPE_OWNER_USER:frappe_owner}
spring.flyway.password=${FRAPPE_OWNER_PASSWORD:frappe_owner}
spring.flyway.locations=classpath:db/migration
spring.flyway.schemas=platform
