spring.application.name=frappe-api

# No credential defaults here: outside the local profile startup fails unless these are set.
# Runtime role: DML only (see docker/postgres/initdb).
spring.datasource.url=${FRAPPE_DB_URL}
spring.datasource.username=${FRAPPE_APP_USER:frappe_app}
spring.datasource.password=${FRAPPE_APP_PASSWORD}

# Migration role: owns module schemas. One history table for the whole database.
spring.flyway.user=${FRAPPE_OWNER_USER:frappe_owner}
spring.flyway.password=${FRAPPE_OWNER_PASSWORD}
spring.flyway.locations=classpath:db/migration
spring.flyway.schemas=platform
