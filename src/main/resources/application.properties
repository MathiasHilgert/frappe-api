spring.application.name=frappe-api

# No credential defaults here: outside the local profile startup fails unless these are set.
# Runtime role: DML only (see docker/postgres/initdb).
spring.datasource.url=${FRAPPE_DB_URL}
spring.datasource.username=${FRAPPE_APP_USER:frappe_app}
spring.datasource.password=${FRAPPE_APP_PASSWORD}

# Migration role: owns module schemas. One history table for the whole database.
spring.flyway.user=${FRAPPE_OWNER_USER:frappe_owner}
spring.flyway.password=${FRAPPE_OWNER_PASSWORD}
spring.flyway.locations=classpath:db/migration
spring.flyway.schemas=platform

# One JSON object per line (Elastic Common Schema); SLF4J key/values and MDC become JSON fields.
logging.structured.format.console=ecs
# Micrometer Tracing writes traceId/spanId to the MDC; ECS names them trace.id and span.id.
logging.structured.json.rename[traceId]=trace.id
logging.structured.json.rename[spanId]=span.id

# Observability: Micrometer Observation over OpenTelemetry, exported via OTLP (see README, "Observability").
# Spans export only when management.opentelemetry.tracing.export.otlp.endpoint is set (or compose's otel-lgtm runs);
# metrics go to management.otlp.metrics.export.url. Both are set from the environment outside the local profile.
management.tracing.sampling.probability=${FRAPPE_TRACING_SAMPLING_PROBABILITY:0.1}
# JDBC spans carry the SQL text only; bound values (possibly personal data) never leave the process.
jdbc.datasource-proxy.include-parameter-values=false

# Transactional outbox: Spring Modulith's JDBC event publication registry in the platform schema. Flyway owns the
# tables (db/migration/platform), so the registry never creates them. Acknowledged publications move to
# platform.event_publication_archive, keeping the outbox small and the delivery history queryable.
spring.modulith.events.jdbc.schema=platform
spring.modulith.events.jdbc.schema-initialization.enabled=false
spring.modulith.events.completion-mode=archive


# HTTP security: bearer sessions (SessionResolver) are the only login, so Boot's generated in-memory user is off.
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

# OpenAPI: the spec is generated from the routes and served at /v3/api-docs; the Scalar API reference (/scalar) only
# in the local profile.
scalar.enabled=false

# Client address: Tomcat takes X-Forwarded-For (and -Proto, -Host) only from a trusted proxy, reading right to left, so
# a caller cannot claim an address. Set FRAPPE_TRUSTED_PROXIES to the proxy's addresses (CIDR list or regex).
server.forward-headers-strategy=native
server.tomcat.remoteip.internal-proxies=${FRAPPE_TRUSTED_PROXIES:127.0.0.0/8, ::1/128}

# No static resources: every path is either an annotated route with a declared posture, or 404.
spring.web.resources.add-mappings=false

# Valkey: short-lived secrets and rate limits (platform.infrastructure.valkey). No URL default outside the local profile;
# compose's valkey service is found by Spring Boot's Docker Compose support. Connections open lazily, so the API starts
# without Valkey, and a request waits at most the timeouts below before failing with SecretStoreUnavailableException.
spring.data.redis.url=${FRAPPE_VALKEY_URL}
# Server-side pepper for stored code hashes (at least 32 random characters); never stored in Valkey.
frappe.secrets.pepper=${FRAPPE_SECRET_PEPPER}
spring.data.redis.timeout=2s
spring.data.redis.connect-timeout=2s
spring.data.redis.repositories.enabled=false
# A Valkey outage degrades only code and rate-limit flows; the rest of the API stays up and healthy.
management.health.redis.enabled=false

# Machine translation (platform.infrastructure.i18n): blank by default, which is a normal condition — the API starts
# and MachineTranslator reports unavailable until FRAPPE_DEEPL_API_KEY is set (Bitwarden: frappe-dev, frappe-production).
frappe.translation.deepl.api-key=${FRAPPE_DEEPL_API_KEY:}
