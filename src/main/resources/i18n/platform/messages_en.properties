# Problem details the platform answers for failures no module maps (type https://frappe.app/problems/<slug>).
platform.problem.invalid-request.title=Invalid request
platform.problem.invalid-request.detail=The request could not be read. Check its syntax and parameters.
# {0}: number of invalid fields, listed in the problem's errors.
platform.problem.invalid-request.fields={0, plural, one {# field is invalid.} other {# fields are invalid.}}
platform.problem.unauthenticated.title=Authentication required
platform.problem.unauthenticated.detail=Sign in and send the request with a valid bearer token.
platform.problem.forbidden.title=Access denied
platform.problem.forbidden.detail=This request is not allowed.
platform.problem.not-found.title=Not found
platform.problem.not-found.detail=There is nothing at this address.
platform.problem.method-not-allowed.title=Method not allowed
platform.problem.method-not-allowed.detail=This address does not support this method; the Allow header lists the ones it supports.
platform.problem.not-acceptable.title=Not acceptable
platform.problem.not-acceptable.detail=None of the requested media types can be produced.
platform.problem.content-too-large.title=Content too large
platform.problem.content-too-large.detail=The request body is larger than allowed.
platform.problem.unsupported-media-type.title=Unsupported media type
platform.problem.unsupported-media-type.detail=The media type of the request body is not supported.
platform.problem.request-rejected.title=Request rejected
platform.problem.request-rejected.detail=The request could not be processed.
platform.problem.internal-error.title=An unexpected error occurred
platform.problem.internal-error.detail=Try again later. If it keeps happening, contact support with the trace id.
# Details of the errors of an invalid request body, one per violated constraint (code = constraint name, kebab-case).
# Arguments are the constraint's attributes sorted by name: size has {0} = max and {1} = min.
platform.validation.invalid=is invalid
platform.validation.not-null=must be present
platform.validation.not-blank=must not be blank
platform.validation.not-empty=must not be empty
platform.validation.size=must have between {1} and {0} characters or items
platform.validation.min=must be at least {0}
platform.validation.max=must be at most {0}
platform.validation.pattern=has an invalid format
platform.validation.email=must be an email address
