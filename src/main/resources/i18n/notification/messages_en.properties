# Mails of notification (templates src/main/jte/notification/<name>.jte).
# {0}: minutes until the code expires.
notification.mail.code.expires={0, plural, one {The code expires in # minute.} other {The code expires in # minutes.}}
notification.mail.sign-up-code.subject=Your code to create your Frappé account
notification.mail.sign-up-code.intro=Enter this code to confirm your email address and create your Frappé account:
notification.mail.sign-up-code.not-you=If you did not try to create an account, ignore this email.
notification.mail.email-change-code.subject=Your code to change your Frappé email
notification.mail.email-change-code.intro=Enter this code to confirm this address as the new email of your Frappé account:
notification.mail.email-change-code.not-you=If you did not ask to change your email, ignore this email; your account keeps its current address.
notification.mail.password-reset-code.subject=Your code to reset your Frappé password
notification.mail.password-reset-code.intro=Enter this code to choose a new password for your Frappé account:
notification.mail.password-reset-code.not-you=If you did not ask to reset your password, ignore this email; your password stays the same.
notification.mail.account-recovery-code.subject=Your code to recover your Frappé account
notification.mail.account-recovery-code.intro=Enter this code to confirm this address and recover your Frappé account:
notification.mail.account-recovery-code.not-you=If you are not recovering an account, ignore this email.
# Sent instead of a sign-up code when the address already has an account; it must not reveal anything else.
notification.mail.account-exists.subject=You already have a Frappé account
notification.mail.account-exists.intro=Someone tried to create a Frappé account with this email address, but it already has one.
notification.mail.account-exists.sign-in=If it was you, sign in with your email and password.
notification.mail.account-exists.reset=If you forgot your password, reset it from the sign-in screen.
notification.mail.account-exists.not-you=If it was not you, ignore this email; your account has not changed.
