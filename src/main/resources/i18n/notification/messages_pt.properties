# Mails of notification (templates src/main/jte/notification/<name>.jte).
# {0}: minutes until the code expires.
notification.mail.code.expires={0, plural, one {O código expira em # minuto.} other {O código expira em # minutos.}}
notification.mail.sign-up-code.subject=Seu código para criar sua conta do Frappé
notification.mail.sign-up-code.intro=Digite este código para confirmar seu e-mail e criar sua conta do Frappé:
notification.mail.sign-up-code.not-you=Se você não tentou criar uma conta, ignore este e-mail.
notification.mail.email-change-code.subject=Seu código para alterar seu e-mail do Frappé
notification.mail.email-change-code.intro=Digite este código para confirmar este endereço como o novo e-mail da sua conta do Frappé:
notification.mail.email-change-code.not-you=Se você não pediu para alterar seu e-mail, ignore esta mensagem; sua conta mantém o endereço atual.
notification.mail.password-reset-code.subject=Seu código para redefinir sua senha do Frappé
notification.mail.password-reset-code.intro=Digite este código para escolher uma nova senha para sua conta do Frappé:
notification.mail.password-reset-code.not-you=Se você não pediu para redefinir sua senha, ignore este e-mail; sua senha continua a mesma.
notification.mail.account-recovery-code.subject=Seu código para recuperar sua conta do Frappé
notification.mail.account-recovery-code.intro=Digite este código para confirmar este endereço e recuperar sua conta do Frappé:
notification.mail.account-recovery-code.not-you=Se você não está recuperando uma conta, ignore este e-mail.
# Sent instead of a sign-up code when the address already has an account; it must not reveal anything else.
notification.mail.account-exists.subject=Você já tem uma conta do Frappé
notification.mail.account-exists.intro=Alguém tentou criar uma conta do Frappé com este e-mail, mas ele já tem uma.
notification.mail.account-exists.sign-in=Se foi você, entre com seu e-mail e sua senha.
notification.mail.account-exists.reset=Se você esqueceu sua senha, redefina-a na tela de entrada.
notification.mail.account-exists.not-you=Se não foi você, ignore este e-mail; sua conta não foi alterada.
