# Mails of notification (templates src/main/jte/notification/<name>.jte).
# {0}: minutes until the code expires.
notification.mail.code.expires={0, plural, one {El código vence en # minuto.} other {El código vence en # minutos.}}
notification.mail.sign-up-code.subject=Tu código para crear tu cuenta de Frappé
notification.mail.sign-up-code.intro=Ingresa este código para confirmar tu correo y crear tu cuenta de Frappé:
notification.mail.sign-up-code.not-you=Si no intentaste crear una cuenta, ignora este correo.
notification.mail.email-change-code.subject=Tu código para cambiar tu correo de Frappé
notification.mail.email-change-code.intro=Ingresa este código para confirmar esta dirección como el nuevo correo de tu cuenta de Frappé:
notification.mail.email-change-code.not-you=Si no pediste cambiar tu correo, ignora este mensaje; tu cuenta mantiene su dirección actual.
notification.mail.password-reset-code.subject=Tu código para restablecer tu contraseña de Frappé
notification.mail.password-reset-code.intro=Ingresa este código para elegir una nueva contraseña para tu cuenta de Frappé:
notification.mail.password-reset-code.not-you=Si no pediste restablecer tu contraseña, ignora este correo; tu contraseña no cambia.
notification.mail.account-recovery-code.subject=Tu código para recuperar tu cuenta de Frappé
notification.mail.account-recovery-code.intro=Ingresa este código para confirmar esta dirección y recuperar tu cuenta de Frappé:
notification.mail.account-recovery-code.not-you=Si no estás recuperando una cuenta, ignora este correo.
# Sent instead of a sign-up code when the address already has an account; it must not reveal anything else.
notification.mail.account-exists.subject=Ya tienes una cuenta de Frappé
notification.mail.account-exists.intro=Alguien intentó crear una cuenta de Frappé con este correo, pero ya tiene una.
notification.mail.account-exists.sign-in=Si fuiste tú, inicia sesión con tu correo y tu contraseña.
notification.mail.account-exists.reset=Si olvidaste tu contraseña, restablécela desde la pantalla de inicio de sesión.
notification.mail.account-exists.not-you=Si no fuiste tú, ignora este correo; tu cuenta no cambió.
