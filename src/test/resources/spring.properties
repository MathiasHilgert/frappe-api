# Bounds Spring's test context cache (default 32). Every cached context keeps its Hikari pool open (4 connections, see
# TestcontainersConfiguration), so 8 contexts hold at most 32 of Postgres' 100 slots, leaving room for Flyway, the
# owner-role test connections and future contexts. Measured with FAPI-6 (12 distinct contexts): no context is
# recreated after eviction (test classes run grouped) and `./gradlew test` stays at about 41 s, as with the default.
spring.test.context.cache.maxSize=8
