# go-arch-lint (github.com/fe3dback/go-arch-lint) architecture specification.
# Enforces the hexagonal layering documented in the repository: each module
# is domain / application / adapters / module root, foundation makes the
# application run without business logic, dependencies is the composition
# root that wires modules into the application, and cmd is the only place
# that knows concrete modules. Run locally with `task architecture:check`
# (see .github/workflows/ci.yml for the pinned CI invocation).
version: 3

workdir: .

allow:
  # Vendor (third-party and stdlib) import restrictions per layer are
  # enforced by depguard in .golangci.yml; go-arch-lint here only checks
  # first-party component boundaries, so any vendor import is allowed.
  depOnAnyVendor: true
  # ignoreNotFoundComponents keeps the check passing while most components
  # have no matching packages yet (almost no code exists at this point).
  ignoreNotFoundComponents: true

excludeFiles:
  - '.*_test\.go$'

components:
  cmd:
    in: cmd/**

  # cmd/migrate is split out of cmd so it, and only it, may depend on
  # migrations: cmd/api must never import migrations (it never runs
  # migrations itself; see cmd/migrate/main.go).
  cmd_migrate:
    in: cmd/migrate/**

  # migrations is a leaf: it embeds SQL files and must not import
  # anything first-party. Only cmd_migrate and foundation_database_test
  # (its integration-test helper, matched first below so it never falls
  # into the general foundation component) may depend on it.
  migrations:
    in: migrations/**

  # foundation_database_test is internal/foundation/database/databasetest:
  # a test-only helper that provisions isolated Postgres databases for
  # integration tests (pgtestdb + testcontainers-go). Matched before the
  # general foundation component below so it gets its own, narrower
  # dependency rules. No production component lists it in mayDependOn, so
  # go-arch-lint itself keeps it out of production code; see also the
  # depguard rule in .golangci.yml, which blocks importing it from any
  # non "_test.go" file.
  foundation_database_test:
    in: internal/foundation/database/databasetest/**

  # foundation_configuration and foundation_configuration_environment are
  # split out of foundation (matched first, so they take precedence for
  # this subpath) because modules must build their own
  # Configuration/Dependencies structs by constructor injection and must
  # never import the application-wide configuration package directly; see
  # deps below and internal/dependencies/doc.go.
  foundation_configuration_environment:
    in: internal/foundation/configuration/environment/**

  foundation_configuration:
    in: internal/foundation/configuration/**

  # foundation_events is the broker-agnostic event platform
  # (internal/foundation/events): event definitions, the CloudEvents
  # envelope and the Recorder/Publisher/Subscriber ports. It is a leaf and
  # is split out of foundation because modules (including their application
  # layer and their published events packages) may depend on it, while they
  # must not depend on the rest of foundation. foundation_events_outbox is
  # the storage-agnostic transactional outbox built on those ports, and
  # foundation_events_support holds its adapters and test kits (in-memory
  # broker and store, eventstest, brokertest, storetest). All three are
  # matched before the general foundation component.
  foundation_events:
    in: internal/foundation/events

  foundation_events_outbox:
    in: internal/foundation/events/outbox

  # foundation_events_outbox_postgres is the Postgres outbox.Store. It is
  # the only event-platform package that needs the database foundation
  # package (to join the business transaction through
  # database.TransactionFromContext), so it is split out of
  # foundation_events_support rather than letting every support package
  # (brokers, test kits) depend on foundation. Matched before
  # foundation_events_support.
  foundation_events_outbox_postgres:
    in: internal/foundation/events/outbox/postgres/**

  foundation_events_support:
    in: internal/foundation/events/**

  # foundation_nats is the NATS JetStream broker adapter
  # (internal/foundation/nats). It implements the foundation_events ports,
  # so, unlike the general foundation leaves, it may depend on
  # foundation_events. Matched before the general foundation component.
  foundation_nats:
    in: internal/foundation/nats/**

  foundation:
    in: internal/foundation/**

  dependencies:
    in: internal/dependencies/**

  module_domain:
    in: internal/modules/*/domain/**

  # module_events is a module's published language
  # (internal/modules/<module>/events): its event definitions and payload
  # types. It is the only package of a module that other modules may
  # import, and it may depend on foundation_events only, so importing it
  # never drags another module's internals along. A module's domain stays
  # pure and may not import it; application, adapters and module root may.
  module_events:
    in: internal/modules/*/events/**

  module_metrics:
    in: internal/modules/*/metrics/**

  module_tracing:
    in: internal/modules/*/tracing/**

  module_application:
    in: internal/modules/*/application/**

  module_adapters:
    in: internal/modules/*/adapters/**

  module_root:
    in: internal/modules/*

deps:
  cmd:
    mayDependOn:
      - foundation
      - foundation_configuration
      - foundation_configuration_environment
      - foundation_events
      - foundation_events_outbox
      - foundation_events_outbox_postgres
      - foundation_events_support
      - foundation_nats
      - dependencies
      - module_root
      - module_adapters
      - module_application
      - module_domain
      - module_events

  cmd_migrate:
    mayDependOn:
      - migrations

  foundation_database_test:
    mayDependOn:
      - foundation
      - migrations

  # migrations intentionally has no deps entry: it is a leaf and may not
  # depend on any other component, including foundation.

  # foundation, foundation_configuration, foundation_events and
  # module_domain intentionally have no deps entry: they are leaves and may
  # not depend on any other component. Modules and foundation must never
  # import the composition root: dependencies wires modules in, never the
  # other way around. Modules must never import foundation_configuration or
  # foundation_configuration_environment: each module declares its own
  # Configuration struct and receives values by constructor injection from
  # the composition root instead.

  foundation_configuration_environment:
    mayDependOn:
      - foundation_configuration

  foundation_events_outbox:
    mayDependOn:
      - foundation_events

  foundation_events_outbox_postgres:
    mayDependOn:
      - foundation
      - foundation_events
      - foundation_events_outbox

  foundation_events_support:
    mayDependOn:
      - foundation_events
      - foundation_events_outbox

  foundation_nats:
    mayDependOn:
      - foundation_events

  dependencies:
    mayDependOn:
      - foundation
      - foundation_nats
      - foundation_configuration
      - foundation_configuration_environment
      - foundation_events
      - foundation_events_outbox
      - foundation_events_outbox_postgres
      - foundation_events_support
      - module_root
      - module_adapters
      - module_application
      - module_domain
      - module_events

  # module_events may depend on foundation_events only: a published events
  # package carries definitions and payload types, nothing else.
  module_events:
    mayDependOn:
      - foundation_events

  module_metrics:
    mayDependOn:
      - foundation

  module_tracing:
    mayDependOn:
      - foundation

  # module_application may use foundation_events (Recorder port, events.On)
  # and module_events (its own and other modules' published events).
  module_application:
    mayDependOn:
      - module_domain
      - module_events
      - module_metrics
      - module_tracing
      - foundation_events

  module_adapters:
    mayDependOn:
      - module_domain
      - module_application
      - module_events
      - module_metrics
      - module_tracing
      - foundation
      - foundation_events

  module_root:
    mayDependOn:
      - module_domain
      - module_application
      - module_adapters
      - module_events
      - module_metrics
      - module_tracing
      - foundation
      - foundation_events
