# go-arch-lint (github.com/fe3dback/go-arch-lint) architecture specification.
# Enforces the hexagonal layering documented in the repository: each module
# is domain / application / adapters / module root, foundation makes the
# application run without business logic, dependencies is the composition
# root that wires modules into the application, and cmd is the only place
# that knows concrete modules. Run locally with `task architecture:check`
# (see .github/workflows/ci.yml for the pinned CI invocation).
version: 3

workdir: .

allow:
  # Vendor (third-party and stdlib) import restrictions per layer are
  # enforced by depguard in .golangci.yml; go-arch-lint here only checks
  # first-party component boundaries, so any vendor import is allowed.
  depOnAnyVendor: true
  # ignoreNotFoundComponents keeps the check passing while most components
  # have no matching packages yet (almost no code exists at this point).
  ignoreNotFoundComponents: true

excludeFiles:
  - '.*_test\.go$'

components:
  cmd:
    in: cmd/**

  # foundation_configuration and foundation_configuration_environment are
  # split out of foundation (matched first, so they take precedence for
  # this subpath) because modules must build their own
  # Configuration/Dependencies structs by constructor injection and must
  # never import the application-wide configuration package directly; see
  # deps below and internal/dependencies/doc.go.
  foundation_configuration_environment:
    in: internal/foundation/configuration/environment/**

  foundation_configuration:
    in: internal/foundation/configuration/**

  foundation:
    in: internal/foundation/**

  dependencies:
    in: internal/dependencies/**

  module_domain:
    in: internal/modules/*/domain/**

  module_application:
    in: internal/modules/*/application/**

  module_adapters:
    in: internal/modules/*/adapters/**

  module_root:
    in: internal/modules/*

deps:
  cmd:
    mayDependOn:
      - foundation
      - foundation_configuration
      - foundation_configuration_environment
      - dependencies
      - module_root
      - module_adapters
      - module_application
      - module_domain

  # foundation, foundation_configuration and module_domain intentionally
  # have no deps entry: they are leaves and may not depend on any other
  # component. Modules and foundation must never import the composition
  # root: dependencies wires modules in, never the other way around.
  # Modules must never import foundation_configuration or
  # foundation_configuration_environment: each module declares its own
  # Configuration struct and receives values by constructor injection from
  # the composition root instead.

  foundation_configuration_environment:
    mayDependOn:
      - foundation_configuration

  dependencies:
    mayDependOn:
      - foundation
      - foundation_configuration
      - foundation_configuration_environment
      - module_root
      - module_adapters
      - module_application
      - module_domain

  module_application:
    mayDependOn:
      - module_domain

  module_adapters:
    mayDependOn:
      - module_domain
      - module_application
      - foundation

  module_root:
    mayDependOn:
      - module_domain
      - module_application
      - module_adapters
      - foundation
