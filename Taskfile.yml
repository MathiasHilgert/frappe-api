# Local task runner (go-task) providing parity with the CI workflows.
# Install: https://taskfile.dev
#
# Naming convention: tasks are named "<domain>:<action>" (e.g. lint:run,
# test:unit) so they stay easy to discover and type. Future domains (e.g.
# migrations:run) should follow the same pattern.
version: '3'

tasks:
  default:
    desc: List all available tasks.
    cmds:
      - task --list

  lint:run:
    desc: Run static analysis with golangci-lint using .golangci.yml.
    cmds:
      - golangci-lint run

  lint:format:
    desc: Check formatting (gofumpt/goimports) without modifying files; shows a diff.
    cmds:
      - golangci-lint fmt --diff

  lint:fix:
    desc: Apply formatting and auto-fixable lint issues in place.
    cmds:
      - golangci-lint fmt
      - golangci-lint run --fix

  test:unit:
    desc: Run unit tests with race detector and coverage.
    cmds:
      - go test -race -count=1 -coverprofile=coverage.out ./...

  test:integration:
    desc: Run integration tests (files tagged //go:build integration, TestIntegration*).
    cmds:
      - go test -race -count=1 -tags=integration -run Integration ./...

  test:all:
    desc: Run unit and integration tests.
    cmds:
      - task: test:unit
      - task: test:integration

  security:vuln:
    desc: Scan dependencies and code for known vulnerabilities with govulncheck.
    cmds:
      - go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  architecture:check:
    desc: Check hexagonal architecture boundaries with go-arch-lint using .go-arch-lint.yml.
    cmds:
      - go run github.com/fe3dback/go-arch-lint@v1.19.0 check --project-path .

  application:run:
    desc: Run the API locally with go run.
    cmds:
      - go run ./cmd/api

  secrets:run:
    desc: Run the API with secrets injected by the Infisical CLI.
    cmds:
      - infisical run -- go run ./cmd/api

  observability:up:
    desc: Start the local observability stack (Grafana, Loki, Tempo, Mimir).
    cmds:
      - docker compose up -d observability
      - echo "Grafana URL http://localhost:3000"

  observability:down:
    desc: Stop the local observability stack.
    cmds:
      - docker compose stop observability

  database:up:
    desc: Start the local Postgres database.
    cmds:
      - docker compose up -d database

  database:down:
    desc: Stop the local Postgres database.
    cmds:
      - docker compose stop database

  valkey:up:
    desc: Start the local Valkey (backs rate limiting; set RATE_LIMIT_ENABLED=true and VALKEY_ADDRESS=localhost:6379).
    cmds:
      - docker compose up -d valkey

  valkey:down:
    desc: Stop the local Valkey.
    cmds:
      - docker compose stop valkey

  migrations:create:
    desc: 'Create a new SQL migration file, timestamp-versioned (usage: task migrations:create -- <name>).'
    cmds:
      - go run github.com/pressly/goose/v3/cmd/goose@v3.28.0 -dir migrations create {{.CLI_ARGS}} sql

  migrations:run:
    desc: Apply every pending migration (requires DATABASE_MIGRATION_URL).
    cmds:
      - go run ./cmd/migrate up

  migrations:rollback:
    desc: Roll back the most recently applied migration (requires DATABASE_MIGRATION_URL).
    cmds:
      - go run ./cmd/migrate down

  migrations:status:
    desc: Show the status of every migration (requires DATABASE_MIGRATION_URL).
    cmds:
      - go run ./cmd/migrate status
  dependencies:tidy:
    desc: Tidy go.mod and go.sum with go mod tidy.
    cmds:
      - go mod tidy

  dependencies:check:
    desc: Fail if go mod tidy would change go.mod or go.sum.
    cmds:
      - task: dependencies:tidy
      # status (not diff) tolerates a missing go.sum and catches a newly created one.
      - cmd: test -z "$(git status --porcelain -- go.mod go.sum)" || (git diff -- go.mod go.sum; echo "go.mod/go.sum are not tidy; commit the result of go mod tidy." >&2; exit 1)

  ci:run:
    desc: Run the full local check suite (lint, format check, dependency tidy check, tests, vuln scan, architecture check).
    cmds:
      - task: lint:run
      - task: lint:format
      - task: dependencies:check
      - task: test:all
      - task: security:vuln
      - task: architecture:check
