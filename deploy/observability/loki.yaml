# Loki in monolithic mode on the local filesystem: logs arrive over OTLP from the collector. The schema applies from the epoch, so it covers every log.
auth_enabled: false
server: { http_listen_port: 3100, log_level: warn }
common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  replication_factor: 1
  ring: { kvstore: { store: inmemory } }
  storage:
    filesystem: { chunks_directory: /loki/chunks, rules_directory: /loki/rules }
schema_config:
  configs:
    - from: 1970-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index: { prefix: index_, period: 24h }
# Local telemetry is bounded: the compactor deletes logs older than the retention period.
compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem
limits_config:
  retention_period: 168h
  allow_structured_metadata: true
  volume_enabled: true
