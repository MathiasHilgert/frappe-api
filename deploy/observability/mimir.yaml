# Mimir in monolithic mode on the local filesystem, single tenant: metrics arrive over OTLP from the collector and
# from Tempo's metrics generator.
multitenancy_enabled: false
server: { http_listen_port: 9009, log_level: warn }
common:
  storage:
    backend: filesystem
    filesystem: { dir: /data/common }
blocks_storage:
  backend: filesystem
  filesystem: { dir: /data/blocks }
  bucket_store: { sync_dir: /data/tsdb-sync }
  tsdb: { dir: /data/tsdb }
compactor:
  data_dir: /data/compactor
  sharding_ring: { kvstore: { store: memberlist } }
distributor:
  ring: { instance_addr: 127.0.0.1, kvstore: { store: memberlist } }
ingester:
  ring: { instance_addr: 127.0.0.1, kvstore: { store: memberlist }, replication_factor: 1 }
ruler_storage:
  backend: filesystem
  filesystem: { dir: /data/rules }
store_gateway:
  sharding_ring: { replication_factor: 1 }
limits:
  native_histograms_ingestion_enabled: true
  max_global_exemplars_per_user: 100000
