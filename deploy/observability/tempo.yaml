# Tempo in monolithic mode on the local filesystem. Its metrics generator writes span metrics and the service graph
# to Mimir, so Grafana can link traces to RED metrics.
stream_over_http_enabled: true
server: { http_listen_port: 3200, log_level: warn }
distributor:
  receivers:
    otlp:
      protocols:
        grpc: { endpoint: 0.0.0.0:4317 }
        http: { endpoint: 0.0.0.0:4318 }
storage:
  trace:
    backend: local
    wal: { path: /var/tempo/wal }
    local: { path: /var/tempo/blocks }
metrics_generator:
  registry: { external_labels: { source: tempo } }
  storage:
    path: /var/tempo/generator/wal
    remote_write: [{ url: "http://mimir:9009/api/v1/push", send_exemplars: true }]
overrides:
  defaults:
    metrics_generator:
      processors: [service-graphs, span-metrics]
