# Every Frappé process sends OTLP here; the collector fans signals out to the LGTM backends.
receivers:
  otlp:
    protocols:
      grpc: { endpoint: 0.0.0.0:4317 }
      http: { endpoint: 0.0.0.0:4318 }

processors:
  memory_limiter: { check_interval: 1s, limit_percentage: 80, spike_limit_percentage: 25 }
  batch: {}

exporters:
  otlphttp/loki: { endpoint: http://loki:3100/otlp }
  otlp/tempo: { endpoint: tempo:4317, tls: { insecure: true } }
  otlphttp/mimir: { endpoint: http://mimir:9009/otlp }

extensions:
  health_check: { endpoint: 0.0.0.0:13133 }

service:
  extensions: [health_check]
  pipelines:
    traces: { receivers: [otlp], processors: [memory_limiter, batch], exporters: [otlp/tempo] }
    metrics: { receivers: [otlp], processors: [memory_limiter, batch], exporters: [otlphttp/mimir] }
    logs: { receivers: [otlp], processors: [memory_limiter, batch], exporters: [otlphttp/loki] }
