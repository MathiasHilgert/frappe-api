# Frappé locally: the three hosts from one image, their infrastructure and the LGTM observability stack.
# Usage: cp deploy/.env.example deploy/.env (fill it in), then `just stack up` (or `docker compose -f deploy/compose.yaml
# up -d --build`). Every port is published on the host; each one can be moved in deploy/.env when it is taken.
# Grafana starts with its datasources, the dashboards of provisioning/dashboards and the alert rules of provisioning/alerting.
name: frappe

x-frappe-image: &frappe-image
  image: frappe-api:${FRAPPE_IMAGE_TAG:-local}
  build:
    context: ..
    dockerfile: deploy/Dockerfile

x-otel: &otel
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
  OTEL_EXPORTER_OTLP_PROTOCOL: grpc

services:
  postgres:
    image: postgis/postgis:18-3.7-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: frappe
      POSTGRES_USER: ${POSTGRES_OWNER_USER:?set it in .env}
      POSTGRES_PASSWORD: ${POSTGRES_OWNER_PASSWORD:?set it in .env}
    ports: ["${POSTGRES_PORT:-5432}:5432"]
    volumes: [postgres-data:/var/lib/postgresql]
    healthcheck:
      # Over TCP: while the image initializes the database it runs a temporary server on the Unix socket only, which
      # pg_isready would report as ready before the real server accepts connections.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d frappe"]
      interval: 5s
      timeout: 3s
      retries: 20

  nats:
    image: nats:2.11-alpine
    restart: unless-stopped
    command: ["--jetstream", "--store_dir", "/data", "--http_port", "8222"]
    ports: ["127.0.0.1:${NATS_PORT:-4222}:4222", "127.0.0.1:${NATS_MONITOR_PORT:-8222}:8222"]
    volumes: [nats-data:/data]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8222/healthz?js-enabled-only=true"]
      interval: 5s
      timeout: 3s
      retries: 20

  valkey:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    ports: ["127.0.0.1:${VALKEY_PORT:-6379}:6379"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # The one-shot database setup: roles, migrations and grants of every database the platform and the listed modules own. Each
  # module adds its own `Roles__<Name>__Password` here and its connection string to the hosts that use it.
  migrator:
    <<: *frappe-image
    entrypoint: ["/app/migrator/Frappe.Migrator"]
    restart: "no"
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      <<: *otel
      OTEL_SERVICE_NAME: frappe-migrator
      DOTNET_gcServer: "0"
      ConnectionStrings__Owner: Host=postgres;Database=frappe;Username=${POSTGRES_OWNER_USER:?set it in .env};Password=${POSTGRES_OWNER_PASSWORD:?set it in .env}
      Roles__Scheduler__Password: ${FRAPPE_SCHEDULER_PASSWORD:?set it in .env}
      Roles__Identity__Password: ${FRAPPE_IDENTITY_PASSWORD:?set it in .env}
      Roles__IdentityWorker__Password: ${FRAPPE_IDENTITY_WORKER_PASSWORD:?set it in .env}
      Roles__Notifications__Password: ${FRAPPE_NOTIFICATIONS_PASSWORD:?set it in .env}
      Roles__NotificationsWorker__Password: ${FRAPPE_NOTIFICATIONS_WORKER_PASSWORD:?set it in .env}

  api:
    <<: *frappe-image
    restart: unless-stopped
    depends_on:
      migrator: { condition: service_completed_successfully }
      valkey: { condition: service_healthy }
    ports: ["${API_PORT:-8080}:8080"]
    healthcheck:
      # The chiseled image has no curl: the binary itself checks /health/ready.
      test: ["CMD", "/app/api/Frappe.Api", "--probe", "http://localhost:8080/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    environment:
      <<: *otel
      OTEL_SERVICE_NAME: frappe-api
      ConnectionStrings__Valkey: valkey:6379
      ConnectionStrings__Identity: Host=postgres;Database=frappe;Username=frappe_identity;Password=${FRAPPE_IDENTITY_PASSWORD:?set it in .env}
      ConnectionStrings__Notifications: Host=postgres;Database=frappe;Username=frappe_notifications;Password=${FRAPPE_NOTIFICATIONS_PASSWORD:?set it in .env}
      # The key one-time codes are hashed with (S5): only the Api issues and redeems codes.
      Identity__Codes__Key: ${FRAPPE_IDENTITY_CODE_KEY:?set it in .env}
      # The key addresses are hashed with (S12, S13); CurrentKeyId names it, and a rotation adds a key and moves the id.
      Notifications__AddressHash__CurrentKeyId: "1"
      Notifications__AddressHash__Keys__1: ${FRAPPE_NOTIFICATIONS_ADDRESS_HASH_KEY:?set it in .env}
      # The key unsubscribe links are signed with (S5, S12): the Api verifies the token of a one-click unsubscribe with it, the Worker signs with it.
      Notifications__Unsubscribe__SigningKey: ${FRAPPE_NOTIFICATIONS_UNSUBSCRIBE_KEY:?set it in .env}
      # Rotation (docs/notifications-key-rotation.md): the id of the key above, and the earlier keys that only verify. A retired key left
      # unset reaches the container as no variable; the Api and the Worker need the same ones.
      Notifications__Unsubscribe__CurrentKeyId: ${Notifications__Unsubscribe__CurrentKeyId:-1}
      Notifications__Unsubscribe__RetiredKeys__1:
      Notifications__Unsubscribe__RetiredKeys__2:
      # The signing secret of Resend's webhook (S12): the Api refuses to start without it, and answers 400 to a call not signed with it.
      Notifications__Email__Resend__WebhookSecret: ${FRAPPE_NOTIFICATIONS_WEBHOOK_SECRET:?set it in .env}
      # The console's origins, comma separated: credentialed CORS and unsafe requests with the session cookie.
      Http__Console__Origins: ${FRAPPE_CONSOLE_ORIGINS:-http://localhost:5173}
      # Requests one client address may make per window (Http:RateLimit). CI raises it so the whole Bruno collection runs from one address.
      Http__RateLimit__PermitLimit: ${FRAPPE_HTTP_RATE_LIMIT:-120}

  worker:
    <<: *frappe-image
    entrypoint: ["/app/worker/Frappe.Worker"]
    restart: unless-stopped
    depends_on:
      migrator: { condition: service_completed_successfully }
      nats: { condition: service_healthy }
      valkey: { condition: service_healthy }
    environment:
      <<: *otel
      OTEL_SERVICE_NAME: frappe-worker
      ConnectionStrings__Scheduler: Host=postgres;Database=frappe;Username=frappe_scheduler;Password=${FRAPPE_SCHEDULER_PASSWORD:?set it in .env}
      ConnectionStrings__Identity: Host=postgres;Database=frappe;Username=frappe_identity_worker;Password=${FRAPPE_IDENTITY_WORKER_PASSWORD:?set it in .env}
      ConnectionStrings__Notifications: Host=postgres;Database=frappe;Username=frappe_notifications_worker;Password=${FRAPPE_NOTIFICATIONS_WORKER_PASSWORD:?set it in .env}
      ConnectionStrings__Valkey: valkey:6379
      ConnectionStrings__Nats: nats://nats:4222
      Notifications__AddressHash__CurrentKeyId: "1"
      Notifications__AddressHash__Keys__1: ${FRAPPE_NOTIFICATIONS_ADDRESS_HASH_KEY:?set it in .env}
      # The links of a marketing email (S5): signed with the Api's key, to the frontend page and to the Api's one-click route.
      Notifications__Unsubscribe__SigningKey: ${FRAPPE_NOTIFICATIONS_UNSUBSCRIBE_KEY:?set it in .env}
      # Rotation (docs/notifications-key-rotation.md): the id of the key above, and the earlier keys that only verify. A retired key left
      # unset reaches the container as no variable; the Api and the Worker need the same ones.
      Notifications__Unsubscribe__CurrentKeyId: ${Notifications__Unsubscribe__CurrentKeyId:-1}
      Notifications__Unsubscribe__RetiredKeys__1:
      Notifications__Unsubscribe__RetiredKeys__2:
      Notifications__Unsubscribe__PageUrl: ${FRAPPE_NOTIFICATIONS_UNSUBSCRIBE_PAGE_URL:?set it in .env}
      Notifications__Unsubscribe__ApiBaseUrl: ${FRAPPE_NOTIFICATIONS_API_URL:?set it in .env}
      # Emails are only logged unless .env selects Resend (Notifications__Email__Sender=Resend) and holds its key. Never commit the key.
      Notifications__Email__Sender: ${Notifications__Email__Sender:-Logging}
      Notifications__Email__Resend__ApiKey: ${Notifications__Email__Resend__ApiKey:-}
    healthcheck:
      # The Worker serves no HTTP: its readiness port (8082) is open only while every critical dependency answers.
      test: ["CMD", "/app/worker/Frappe.Worker", "--probe", "tcp://localhost:8082"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Observability: OpenTelemetry Collector → Loki (logs), Tempo (traces), Mimir (metrics) → Grafana.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.163.2
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes: ["./observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro"]
    ports: ["127.0.0.1:${OTLP_GRPC_PORT:-4317}:4317", "127.0.0.1:${OTLP_HTTP_PORT:-4318}:4318"]
    depends_on: [loki, tempo, mimir]

  loki:
    image: grafana/loki:3.7.9
    restart: unless-stopped
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes: ["./observability/loki.yaml:/etc/loki/config.yaml:ro", "loki-data:/loki"]
    ports: ["127.0.0.1:${LOKI_PORT:-3100}:3100"]

  tempo:
    image: grafana/tempo:3.1.1
    restart: unless-stopped
    command: ["-config.file=/etc/tempo/config.yaml"]
    volumes: ["./observability/tempo.yaml:/etc/tempo/config.yaml:ro", "tempo-data:/var/tempo"]
    ports: ["127.0.0.1:${TEMPO_PORT:-3200}:3200"]

  mimir:
    image: grafana/mimir:3.2.3
    restart: unless-stopped
    command: ["-config.file=/etc/mimir/config.yaml"]
    volumes: ["./observability/mimir.yaml:/etc/mimir/config.yaml:ro", "mimir-data:/data"]
    ports: ["127.0.0.1:${MIMIR_PORT:-9009}:9009"]

  # Grafana reads its datasources, dashboards and alert rules from provisioning/, all versioned as code.
  grafana:
    image: grafana/grafana:13.2.4
    restart: unless-stopped
    depends_on: [loki, tempo, mimir]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?set it in .env}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set it in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports: ["${GRAFANA_PORT:-3000}:3000"]
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana

volumes:
  postgres-data:
  nats-data:
  loki-data:
  tempo-data:
  mimir-data:
  grafana-data:
