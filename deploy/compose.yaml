name: frappe

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: frappe
      POSTGRES_USER: frappe
      POSTGRES_PASSWORD: frappe
    ports: ["5432:5432"]
    volumes: [postgres:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U frappe -d frappe"]
      interval: 5s
      retries: 10

  nats:
    image: nats:2-alpine
    command: ["--jetstream", "--store_dir=/data", "--http_port=8222"]
    ports: ["4222:4222", "8222:8222"]
    volumes: [nats:/data]

  valkey:
    image: valkey/valkey:9-alpine
    ports: ["6379:6379"]

  # Catches every mail Development sends; nothing is relayed. Web UI: http://localhost:8025, SMTP: 1025.
  mailpit:
    image: axllent/mailpit:v1.27
    ports: ["8025:8025", "1025:1025"]

  # Grafana + Loki + Tempo + Mimir (Prometheus) + OTel collector in one container.
  # Grafana: http://localhost:3000 (admin/admin). OTLP: 4317 gRPC, 4318 HTTP.
  lgtm:
    image: grafana/otel-lgtm:0.37.0
    ports: ["3000:3000", "4317:4317", "4318:4318"]
    volumes: [lgtm:/data]

volumes:
  postgres:
  nats:
  lgtm:
