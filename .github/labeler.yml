# Path labels for pull requests. A label applies when any changed file matches one of its globs.

area/kernel:
  - changed-files:
      - any-glob-to-any-file: src/Kernel/**

area/platform:
  - changed-files:
      - any-glob-to-any-file:
          - src/Platform/**
          - src/Migrations/**

area/host:
  - changed-files:
      - any-glob-to-any-file: src/Host/**

area/build:
  - changed-files:
      - any-glob-to-any-file:
          - eng/**
          - .config/**
          - Directory.Build.props
          - Directory.Packages.props
          - Frappe.slnx
          - global.json
          - nuget.config
          - .editorconfig
          - .gitattributes
          - .gitignore
          - "**/*.csproj"
          - "**/packages.lock.json"

area/ci:
  - changed-files:
      - any-glob-to-any-file:
          - .github/**
          - justfile

area/docs:
  - changed-files:
      - any-glob-to-any-file:
          - LICENSE
          - "*.md"

# Each module adds its own module/<name> label when its first project lands, covering
# src/Modules/<Name>/** and tests/Modules/<Name>/**, for example:
#
# module/orders:
#   - changed-files:
#       - any-glob-to-any-file:
#           - src/Modules/Orders/**
#           - tests/Modules/Orders/**
