# The title, every commit and the branch of the pull request against .github/scripts/conventions.mjs, as one verdict.
# The calling job checks out .github/scripts first and needs `pull-requests: read`. Used by CI and by the workflow that
# re-runs it when the title is edited, so both report the same check from the same code.
name: Pull request follows the conventions
description: Validates the title, the commit messages and the branch name, and rejects AI attribution

runs:
  using: composite
  steps:
    - name: Validate the title, every commit and the branch
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      with:
        script: |
          const { pathToFileURL } = require('node:url');
          const { checkBranch, checkCommitMessage, checkHeader, findAiAttribution } =
            await import(pathToFileURL(`${process.env.GITHUB_WORKSPACE}/.github/scripts/conventions.mjs`));
          const pr = context.payload.pull_request;
          const problems = [];

          const title = checkHeader(pr.title);
          problems.push(...title.problems.map((problem) => `title: ${problem}`));
          for (const line of findAiAttribution(`${pr.title}\n${pr.body ?? ''}`)) {
            problems.push(`title or description: AI attribution is not allowed: "${line}"`);
          }

          problems.push(...checkBranch(pr.head.ref, title.type).map((problem) => `branch: ${problem}`));

          const commits = await github.paginate(github.rest.pulls.listCommits, {
            ...context.repo,
            pull_number: pr.number,
            per_page: 100,
          });
          for (const commit of commits.filter((candidate) => candidate.parents.length < 2)) { // merges from "Update branch" are GitHub's
            for (const problem of checkCommitMessage(commit.commit.message)) {
              problems.push(`commit ${commit.sha.slice(0, 7)}: ${problem}`);
            }
          }

          if (problems.length > 0) {
            core.setFailed(`The pull request breaks the conventions; reword the title or the commits (git rebase -i) and push again:\n${problems.join('\n')}`);
          }
