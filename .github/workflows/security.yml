# Is it safe? Dependencies, secrets, code, the workflows themselves and the image. Also runs weekly: a new advisory
# shows up without anyone touching the code.
name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  changes:
    name: Changes
    # Pull requests only: any other event runs every job, because a skipped "changes" leaves the outputs empty.
    if: github.event_name == 'pull_request'
    # The self-repository form ($/) is what zizmor prefers, but actionlint 1.7.12 cannot parse it yet.
    uses: ./.github/workflows/changes.yml # zizmor: ignore[self-repository]
    permissions:
      contents: read
      pull-requests: read

  dependencies:
    name: No vulnerable dependencies
    needs: changes
    # Skipped (reported as passing) only when the change provably cannot affect it; see .github/scripts/changes.mjs.
    if: ${{ !cancelled() && needs.changes.outputs.image != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Restore packages from the lock files
        run: dotnet restore Frappe.slnx --locked-mode
      - name: Audit direct and transitive packages
        run: |
          dotnet package list --project Frappe.slnx --vulnerable --include-transitive --format json > "$RUNNER_TEMP/vulnerable.json"
          # A source that cannot be queried is reported as a problem with exit code 0: that is no answer, not a pass.
          if [ "$(jq '.problems // [] | length' "$RUNNER_TEMP/vulnerable.json")" -gt 0 ]; then
            jq -r '.problems[] | "\(.level): \(.text)"' "$RUNNER_TEMP/vulnerable.json"
            echo "::error::The vulnerability audit could not complete"
            exit 1
          fi
          count=$(jq '[.projects[].frameworks[]? | (.topLevelPackages // []) + (.transitivePackages // []) | .[]] | length' "$RUNNER_TEMP/vulnerable.json")
          if [ "$count" -gt 0 ]; then
            jq -r '.projects[] | .path as $p | .frameworks[]? | (.topLevelPackages // []) + (.transitivePackages // []) | .[]
              | "\($p): \(.id) \(.resolvedVersion) " + ([.vulnerabilities[]? | "\(.severity) \(.advisoryurl)"] | join(", "))' \
              "$RUNNER_TEMP/vulnerable.json" | sort -u | tee -a "$GITHUB_STEP_SUMMARY"
            echo "::error::$count vulnerable package(s); update them in Directory.Packages.props and run just deps lock"
            exit 1
          fi
          echo "No known vulnerabilities in direct or transitive packages." >> "$GITHUB_STEP_SUMMARY"
      - name: Review the dependencies this pull request adds
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: low

  secrets:
    name: No leaked secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - name: Check out the whole history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_ENABLE_COMMENTS: "false"

  code:
    name: Code has no known vulnerabilities
    needs: changes
    # Skipped (reported as passing) only when the change provably cannot affect it; see .github/scripts/changes.mjs.
    if: ${{ !cancelled() && needs.changes.outputs.dotnet != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize CodeQL for C# and the workflows
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: csharp, actions
          # Source-only analysis: no build, so it does not depend on the .NET release candidate SDK.
          build-mode: none
          queries: security-extended
      - name: Analyze C# and the workflows
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3

  workflows:
    name: Workflows are secure
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint the workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=1.7.12
          archive="actionlint_${version}_linux_amd64.tar.gz"
          gh release download "v$version" --repo rhysd/actionlint --pattern "$archive" --pattern "actionlint_${version}_checksums.txt" --dir "$RUNNER_TEMP"
          (cd "$RUNNER_TEMP" && sha256sum --check --ignore-missing "actionlint_${version}_checksums.txt")
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color
      - name: Audit the workflows for security issues
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          advanced-security: false
          version: "1.32.0"

  image:
    name: Container image is clean
    needs: changes
    # Skipped (reported as passing) only when the change provably cannot affect it; see .github/scripts/changes.mjs.
    if: ${{ !cancelled() && needs.changes.outputs.image != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint the Dockerfile
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: deploy/Dockerfile
          config: eng/hadolint.yaml
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile
          load: true
          tags: frappe-api:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan the image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: frappe-api:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Generate the SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: frappe-api:scan
          format: spdx-json
          artifact-name: frappe-api.spdx.json
