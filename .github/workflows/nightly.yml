name: Nightly mutation testing

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  mutation:
    name: Mutation — do the tests catch injected bugs?
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Set up .NET toolchain
        uses: ./.github/actions/setup-dotnet
      - name: Run mutation tests (Stryker.NET)
        run: just mutate
      - name: Publish mutation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-report
          path: artifacts/mutation/
          retention-days: 14
