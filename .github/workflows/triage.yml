name: Triage

# Assigns and labels pull requests, and syncs the label set to GitHub.
# pull_request_target runs with the base branch's workflow and a token that can write labels,
# so these jobs never check out or run pull request code: they read only the event and the API.
on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] no job checks out or runs PR code
    types: [opened, edited, reopened, synchronize]
  push:
    branches: [main]
    paths: [.github/labels.yml]

permissions: {}

concurrency:
  # One group per event action, so an `edited` event never cancels the author assignment on `opened`.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event.action }}
  cancel-in-progress: true

jobs:
  assign:
    name: Assign the author
    if: >-
      github.event_name == 'pull_request_target'
      && contains(fromJSON('["opened", "reopened"]'), github.event.action)
      && github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Assign the pull request to its author
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: gh pr edit "$NUMBER" --add-assignee "$AUTHOR"

  kind:
    name: Kind label
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write # creates a label the first time it is used
      pull-requests: write
    steps:
      - name: Label the kind from the title's Conventional Commit type
        env:
          GH_TOKEN: ${{ github.token }}
          LABELS_URL: repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/labels
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          declare -A kinds=(
            [feat]=kind/feature [fix]=kind/fix [refactor]=kind/refactor [perf]=kind/perf
            [docs]=kind/docs [test]=kind/test [build]=kind/build [ci]=kind/ci [chore]=kind/chore
            [style]=kind/style [revert]=kind/revert
          )
          wanted=()
          if [[ "$TITLE" =~ ^([a-z]+)(\([^\)]*\))?(!)?: ]]; then
            type=${BASH_REMATCH[1]}
            [[ -n "${kinds[$type]:-}" ]] && wanted+=("${kinds[$type]}")
            [[ -n "${BASH_REMATCH[3]}" ]] && wanted+=(breaking-change)
          fi
          # Drop kind labels a title edit made stale, then add the current ones.
          for label in $(gh api "$LABELS_URL" --jq '.[].name'); do
            if [[ "$label" == kind/* || "$label" == breaking-change ]] \
              && [[ ! " ${wanted[*]} " == *" $label "* ]]; then
              gh api -X DELETE "$LABELS_URL/${label//\//%2F}" --silent
            fi
          done
          for label in "${wanted[@]}"; do
            gh api "$LABELS_URL" -f "labels[]=$label" --silent
          done
          echo "Kind labels: ${wanted[*]:-none}"

  paths:
    name: Path labels
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # reads .github/labeler.yml from the base branch
      issues: write
      pull-requests: write
    steps:
      - name: Label the areas and modules the change touches
        uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          sync-labels: true

  size:
    name: Size label
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Label the size by changed lines
        uses: codelytv/pr-size-labeler@19c335e7695ba922de938806dd129f0a9b992644 # v1.12.0
        with:
          xs_label: size/XS
          s_label: size/S
          m_label: size/M
          l_label: size/L
          xl_label: size/XL
          files_to_ignore: "**/packages.lock.json"

  sync-labels:
    name: Sync labels
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create and update the labels in .github/labels.yml
        uses: crazy-max/ghaction-github-labeler@548a7c3603594ec17c819e1239f281a3b801ab4d # v6.0.0
        with:
          skip-delete: true # labels not in the file are kept, not deleted
