name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

# Every job calls a `just` recipe, so `just ci` reproduces this pipeline locally.
# Lint, build-and-test, security and container start in parallel. Build-and-test compiles the
# solution once, runs every suite in parallel from that build while collecting coverage, then
# merges coverage and enforces the threshold: no job rebuilds and no suite runs twice.
jobs:
  lint:
    name: 1. Lint — format, workflows, Dockerfile, secrets
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Set up .NET toolchain
        uses: ./.github/actions/setup-dotnet
      - name: Check formatting, workflows, Dockerfile and secrets
        run: just lint
      - name: Test the git hygiene scripts
        run: just test-git

  build-test:
    name: 2. Build & test — Release, warnings as errors, unit, architecture, integration, coverage
    timeout-minutes: 25
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Set up .NET toolchain
        uses: ./.github/actions/setup-dotnet
      - name: Build once, run every suite with coverage and enforce the threshold
        run: just cover
      - name: Publish coverage summary to the job page
        if: always()
        run: |
          if [ -f artifacts/coverage/SummaryGithub.md ]; then
            cat artifacts/coverage/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Publish coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: artifacts/coverage/
          retention-days: 14

  security:
    name: 3. Security — vulnerable packages
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Set up .NET toolchain
        uses: ./.github/actions/setup-dotnet
      - name: Check for vulnerable packages
        run: just audit


  container:
    name: 4. Container — build & vulnerability scan
    timeout-minutes: 20
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Install just
        uses: extractions/setup-just@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build the container image (cached)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          load: true
          tags: frappe-api:local
          build-args: |
            REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan the image for HIGH/CRITICAL vulnerabilities (trivy)
        run: just image-scan
