name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

# Every job calls a `just` recipe, so `just ci` reproduces this pipeline locally.
# Lint, build and security start in parallel; tests need the build; coverage needs
# green tests.
# The build job is a fast gate; test jobs rebuild incrementally instead of reusing its output,
# because Microsoft.Testing.Platform test apps need each project's obj/ restore graph.
jobs:
  lint:
    name: 1. Lint — format, workflows, Dockerfile, secrets
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Set up .NET toolchain
        uses: ./.github/actions/setup-dotnet
      - name: Check formatting, workflows, Dockerfile and secrets
        run: just lint
      - name: Test the git hygiene scripts
        run: just test-git

  build:
    name: 2. Build — Release, warnings as errors
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Set up .NET toolchain
        uses: ./.github/actions/setup-dotnet
      - name: Build the solution in Release
        run: just build

  test-fast:
    name: 3. Test — unit & architecture
    timeout-minutes: 15
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Set up .NET toolchain
        uses: ./.github/actions/setup-dotnet
      - name: Run unit and architecture tests
        run: just test fast

  test-integration:
    name: 4. Test — integration (Postgres, NATS, Valkey)
    timeout-minutes: 20
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Set up .NET toolchain
        uses: ./.github/actions/setup-dotnet
      - name: Run integration tests against real containers
        run: just test integration

  coverage:
    name: 5. Coverage — line coverage threshold
    timeout-minutes: 25
    needs: [test-fast, test-integration]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Set up .NET toolchain
        uses: ./.github/actions/setup-dotnet
      - name: Measure coverage and enforce the threshold
        run: just cover
      - name: Publish coverage summary to the job page
        if: always()
        run: |
          if [ -f artifacts/coverage/SummaryGithub.md ]; then
            cat artifacts/coverage/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Publish coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: artifacts/coverage/
          retention-days: 14

  security:
    name: 6. Security — vulnerable packages
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Set up .NET toolchain
        uses: ./.github/actions/setup-dotnet
      - name: Check for vulnerable packages
        run: just audit


  container:
    name: 7. Container — build & vulnerability scan
    timeout-minutes: 20
    needs: [lint, test-fast]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Install just
        uses: extractions/setup-just@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build the container image (cached)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          load: true
          tags: frappe-api:local
          build-args: |
            REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan the image for HIGH/CRITICAL vulnerabilities (trivy)
        run: just image-scan
