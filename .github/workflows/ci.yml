name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  secrets:
    name: Secrets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan the full history for leaked secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  quality-gate:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - name: Check out the branch
        uses: actions/checkout@v7
      - name: Install Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      # npm's download cache for the MJML compiler (npm ci, run by Gradle); Node itself comes with the Gradle caches.
      - name: Cache npm downloads
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      # The named steps tell the story; the last one runs ./gradlew check itself, so CI runs every task the local gate
      # runs (tasks already done are up to date).
      - name: Verify formatting
        run: ./gradlew spotlessCheck
      - name: Verify Javadoc
        run: ./gradlew javadoc
      - name: Test the developer scripts
        run: ./gradlew scriptTests
      - name: Verify module boundaries
        run: ./gradlew test --tests ModularityTests
      - name: Run the test suite against real Postgres
        run: ./gradlew test
      - name: Run the whole local gate
        run: ./gradlew check
      - name: Annotate the pull request with test results
        uses: mikepenz/action-junit-report@v6
        if: always()
        with:
          report_paths: 'build/test-results/test/TEST-*.xml'
          require_tests: true
      - name: Upload the module diagram
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spring-modulith-docs
          path: build/spring-modulith-docs
          if-no-files-found: warn
      - name: Tell the story of this run
        if: always()
        run: |
          {
            echo "## CI story"
            echo
            echo "| Stage | Result |"
            echo "| --- | --- |"
            echo "| Secrets scan | see the Secrets job |"
            echo "| Formatting, Javadoc, developer scripts, module boundaries, tests (\`./gradlew check\`) | ${{ job.status }} |"
            echo
            if compgen -G "build/test-results/test/TEST-*.xml" > /dev/null; then
              TOTAL=$(grep -oh 'tests="[0-9]*"' build/test-results/test/TEST-*.xml | grep -oE '[0-9]+' | paste -sd+ | bc)
              FAILURES=$(grep -oh 'failures="[0-9]*"' build/test-results/test/TEST-*.xml | grep -oE '[0-9]+' | paste -sd+ | bc)
              echo "**Tests:** ${TOTAL:-0} run, ${FAILURES:-0} failed."
            else
              echo "**Tests:** no JUnit XML reports found."
            fi
            echo
            echo "**Module diagram:** the Modulith component diagram was generated to \`build/spring-modulith-docs\` and uploaded as the \`spring-modulith-docs\` artifact of this run."
          } >> "$GITHUB_STEP_SUMMARY"

  image:
    name: OCI image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the branch
        uses: actions/checkout@v7
      # The Leyden AOT training run inside the build needs a live, build-owned Postgres and NATS (README, "Build
      # and run the image locally"); --network=host (granted below) lets the build reach them on localhost.
      - name: Start Postgres and NATS
        run: docker compose up -d --wait postgres nats
      - name: Create the training database (build-owned, never the dev one)
        run: |
          docker compose exec -T -e POSTGRES_DB=frappe_image_train postgres \
            sh -c 'createdb -U "$POSTGRES_USER" "$POSTGRES_DB" 2>/dev/null; /docker-entrypoint-initdb.d/01-frappe-roles.sh'
      # docker-container buildx builders run in their own container with their own network namespace, so a RUN
      # step's --network=host entitlement only reaches the runner's actual localhost (where Postgres/NATS above
      # publish their ports) when the builder container itself joined the host network (driver-opts: network=host);
      # without it, --network=host reaches the builder container's own, empty network instead and the training
      # database connection is refused (proven by reproducing this exact builder locally).
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver-opts: network=host
          buildkitd-flags: --allow-insecure-entitlement network.host
      - name: Build the image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: frappe-api:ci
          allow: network.host
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true
      - name: No secret in a layer, a build arg or the runtime environment
        run: |
          ! docker history --no-trunc frappe-api:ci \
            | grep -Ei 'FRAPPE_(APP|OWNER)_PASSWORD|FRAPPE_SECRET_PEPPER|RESEND_API_KEY|FRAPPE_DEEPL_API_KEY|frappe_app|frappe_owner|local-development-pepper'
          ! docker inspect frappe-api:ci --format '{{.Config.Env}}' \
            | grep -Ei 'FRAPPE_(APP|OWNER)_PASSWORD|FRAPPE_SECRET_PEPPER|RESEND_API_KEY|FRAPPE_DEEPL_API_KEY|frappe_app|frappe_owner|local-development-pepper'
      - name: Runs as a fixed non-root user
        run: |
          test "$(docker inspect frappe-api:ci --format '{{.Config.User}}')" = "10001:10001"
