name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Gradle itself runs on Temurin 21: palantir-java-format (used by
      # Spotless) does not yet support JDK 25 as the host JVM. The Gradle
      # toolchain (foojay resolver, settings.gradle.kts) auto-provisions
      # Temurin 25 to compile, test and run the application.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew check
