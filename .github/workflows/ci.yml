name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  secrets:
    name: Secrets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan the full history for leaked secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  quality-gate:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - name: Check out the branch
        uses: actions/checkout@v4
      - name: Install Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Verify formatting
        run: ./gradlew spotlessCheck
      - name: Verify module boundaries
        run: ./gradlew test --tests ModularityTests
      - name: Run the test suite against real Postgres
        run: ./gradlew test
      - name: Annotate the pull request with test results
        uses: mikepenz/action-junit-report@v5
        if: always()
        with:
          report_paths: 'build/test-results/test/TEST-*.xml'
          require_tests: true
      - name: Upload the module diagram
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spring-modulith-docs
          path: build/spring-modulith-docs
          if-no-files-found: warn
      - name: Tell the story of this run
        if: always()
        run: |
          {
            echo "## CI story"
            echo
            echo "| Stage | Result |"
            echo "| --- | --- |"
            echo "| Secrets scan | see the Secrets job |"
            echo "| Formatting, module boundaries and tests | ${{ job.status }} |"
            echo
            if compgen -G "build/test-results/test/TEST-*.xml" > /dev/null; then
              TOTAL=$(grep -oh 'tests="[0-9]*"' build/test-results/test/TEST-*.xml | grep -oE '[0-9]+' | paste -sd+ | bc)
              FAILURES=$(grep -oh 'failures="[0-9]*"' build/test-results/test/TEST-*.xml | grep -oE '[0-9]+' | paste -sd+ | bc)
              echo "**Tests:** ${TOTAL:-0} run, ${FAILURES:-0} failed."
            else
              echo "**Tests:** no JUnit XML reports found."
            fi
            echo
            echo "**Module diagram:** the Modulith component diagram was generated to \`build/spring-modulith-docs\` and uploaded as the \`spring-modulith-docs\` artifact of this run."
          } >> "$GITHUB_STEP_SUMMARY"
