version: 2

# One grouped pull request per ecosystem per week, titled as a Conventional Commit.
# The cooldown lets a new release age a week before it is proposed.
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    labels: [dependencies]
    groups:
      nuget:
        patterns: ["*"]
    commit-message:
      prefix: build
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    labels: [dependencies]
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
      include: scope

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    labels: [dependencies]
    groups:
      docker:
        patterns: ["*"]
    ignore:
      # The SDK image must stay in the feature band global.json pins; moving bands is its own change.
      - dependency-name: "dotnet/sdk"
        versions: [">= 10.0.200"]
    commit-message:
      prefix: build
      include: scope
