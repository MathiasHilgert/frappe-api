version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    # Conventional Commit titles, so Dependabot PRs pass the PR hygiene checks.
    commit-message:
      prefix: build
      include: scope
    open-pull-requests-limit: 10
    groups:
      wolverine:
        patterns: ["WolverineFx*"]
      opentelemetry:
        patterns: ["OpenTelemetry*"]
      test:
        patterns: ["xunit*", "Microsoft.Testing.*", "Microsoft.NET.Test.Sdk", "Testcontainers*", "Alba", "NetArchTest*", "ArchUnitNET*", "Shouldly", "FluentAssertions", "NSubstitute*", "coverlet*"]
  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: weekly
    # Conventional Commit titles, so Dependabot PRs pass the PR hygiene checks.
    commit-message:
      prefix: build
      include: scope
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /deploy
    schedule:
      interval: weekly
    # Conventional Commit titles, so Dependabot PRs pass the PR hygiene checks.
    commit-message:
      prefix: build
      include: scope
